# Optional: allow live web search without prompts.
web_search = "live"

[sandbox_workspace_write]
network_access = true
# SwiftPM/clang write content-addressed caches outside the workspace; without these
# roots, package resolution and the shared clang module cache fail in the sandbox.
# Build products stay in build/ (via -derivedDataPath); DerivedData is granted only so
# clang can create ModuleCache.noindex (shared across worktrees/schemes/Xcode GUI).
writable_roots = [
  "~/Library/Caches/org.swift.swiftpm",
  "~/Library/org.swift.swiftpm",
  "~/.swiftpm",
  "~/Library/Developer/Xcode/DerivedData",
]

# Required for remote (HTTP) MCP servers: figma, linear.
[features]
rmcp_client = true

[mcp_servers.figma]
url = "https://mcp.figma.com/mcp"

[mcp_servers.linear]
url = "https://mcp.linear.app/mcp"

[mcp_servers.maestro]
command = "scripts/tools/maestro.sh"
args = ["mcp", "--working-dir=maestro_ui_tests"]

[mcp_servers.xcode]
command = "xcrun"
args = ["mcpbridge"]
