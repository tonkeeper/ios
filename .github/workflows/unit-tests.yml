name: Unit Tests

# Standalone unit-test run — does NOT build the app or run any Maestro UI tests.
# Runnable manually (workflow_dispatch) and reused by the nightly "Maestro UI
# Tests" workflow via workflow_call, which runs this job in parallel with the app
# build and UI shards. Standalone, the job status reflects the unit-test result
# directly (fail-on-error: true). The nightly Maestro caller passes
# `non_blocking: true` so a unit failure does not redden that run; the result is
# still surfaced via the maestro-unit-test-results artifact.
on:
  workflow_dispatch:
  # Also callable from the nightly Maestro workflow, which runs this exact job
  # in parallel with the app build and UI shards (see maestro-ui-tests.yml).
  workflow_call:
    inputs:
      non_blocking:
        description: >-
          When true, a unit-test failure does not fail this workflow (the
          "Run unit tests" step runs with continue-on-error). The result is
          still written to unit-tests-exit.txt and uploaded as
          maestro-unit-test-results. Leave false for a gating run.
        type: boolean
        required: false
        default: false

jobs:
  unit-tests:
    name: Run unit tests
    runs-on: macos-26-xlarge
    timeout-minutes: 90
    env:
      MAESTRO_FEATURE_FLAG_OVERRIDES: ${{ secrets.MAESTRO_FEATURE_FLAG_OVERRIDES }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Select Xcode
        uses: ./.github/actions/select-xcode

      # No signing / Firebase / ios_keys setup here: the TonkeeperUnitTests
      # scheme builds only the LocalPackages test bundles on the iOS Simulator.
      # Simulator package tests need no code-signing identity, and the Firebase
      # SDK they compile against comes from Package.resolved — not from the
      # ios_keys GoogleService-Info.plist, which only the app target loads at
      # runtime (and that target is never built here).

      - name: Configure Swift package SCM
        shell: bash
        run: |
          set -euo pipefail
          defaults write com.apple.dt.Xcode IDEPackageSupportUseBuiltinSCM -bool NO
          defaults read com.apple.dt.Xcode IDEPackageSupportUseBuiltinSCM

      - name: Resolve Swift packages
        shell: bash
        env:
          GIT_TERMINAL_PROMPT: "0"
          GCM_INTERACTIVE: Never
          HOME: ${{ github.workspace }}/build/codex_home
          SWIFTPM_CACHE_PATH: ${{ github.workspace }}/build/swiftpm-cache
          SWIFTPM_CONFIG_DIR: ${{ github.workspace }}/build/swiftpm-config
          CLANG_MODULE_CACHE_PATH: ${{ github.workspace }}/build/clang-module-cache
          CLONED_SOURCE_PACKAGES_DIR: ${{ github.workspace }}/build/SourcePackages
        run: |
          set -euo pipefail
          export NSUnbufferedIO=YES
          mkdir -p "$HOME" "$SWIFTPM_CACHE_PATH" "$SWIFTPM_CONFIG_DIR" "$CLANG_MODULE_CACHE_PATH" "$CLONED_SOURCE_PACKAGES_DIR"
          xcodebuild \
            -scmProvider system \
            -resolvePackageDependencies \
            -onlyUsePackageVersionsFromResolvedFile \
            -skipPackageUpdates \
            -project Tonkeeper.xcodeproj \
            -scheme TonkeeperUnitTests \
            -clonedSourcePackagesDirPath "$CLONED_SOURCE_PACKAGES_DIR"

      - name: Write Maestro feature flag overrides
        if: ${{ env.MAESTRO_FEATURE_FLAG_OVERRIDES != '' }}
        shell: bash
        run: |
          set -euo pipefail
          DST="${{ github.workspace }}/Tonkeeper/Resources/FlagsOverride.json"
          printf '%s' "$MAESTRO_FEATURE_FLAG_OVERRIDES" > "$DST"
          python3 -c "import json,sys; json.load(open('$DST'))"
          echo "Maestro feature-flag overrides written to $DST"

      - name: Run unit tests
        continue-on-error: ${{ inputs.non_blocking == true }}
        uses: ./.github/actions/run-unit-tests
        with:
          fail-on-error: "true"
