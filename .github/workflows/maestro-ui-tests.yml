name: Maestro UI Tests

on:
  workflow_dispatch:
    inputs:
      clusters:
        description: Which Maestro clusters to run (schedule always runs all)
        type: choice
        options:
          - all
          - ton-state
          - multichain
        default: all
  schedule:
    - cron: "0 2 * * 2-6"

env:
  DERIVED_DATA: build/DerivedData-maestro
  # Schedule has no inputs; manual dispatch uses the choice above.
  MAESTRO_CLUSTERS: ${{ github.event_name == 'workflow_dispatch' && inputs.clusters || 'all' }}

jobs:
  discover-maestro-clusters:
    name: Resolve Maestro clusters and shards
    if: ${{ github.repository != 'tonkeeper/ios' }}
    runs-on: ubuntu-latest
    outputs:
      clusters: ${{ steps.discover.outputs.clusters }}
      ton_state_shards: ${{ steps.discover.outputs.ton_state_shards }}
      multichain_shards: ${{ steps.discover.outputs.multichain_shards }}
      has_ton_state_shards: ${{ steps.discover.outputs.has_ton_state_shards }}
      has_multichain_shards: ${{ steps.discover.outputs.has_multichain_shards }}
    steps:
      - uses: actions/checkout@v6

      - name: Install PyYAML
        run: pip install pyyaml

      - name: Check API runtime in sync
        run: python3 maestro_ui_tests/scripts/ci/sync_api_runtime.py --check

      - name: Test Maestro CI tooling
        run: |
          python3 -m unittest discover -s maestro_ui_tests/ci/slack_bot -p 'test_*.py'
          python3 -m unittest discover -s maestro_ui_tests/scripts/ci -p 'test_*.py'

      - name: Discover Maestro clusters
        id: discover
        shell: bash
        run: |
          set -euo pipefail
          echo "MAESTRO_CLUSTERS=${MAESTRO_CLUSTERS}"
          python3 maestro_ui_tests/scripts/ci/discover_maestro_clusters.py \
            --repo-root "${{ github.workspace }}" \
            --clusters "${MAESTRO_CLUSTERS}" \
            --github-output
          echo "### Resolve MaestroFlow (\`${MAESTRO_CLUSTERS}\`)" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          python3 maestro_ui_tests/scripts/ci/discover_maestro_clusters.py \
            --repo-root "${{ github.workspace }}" \
            --clusters "${MAESTRO_CLUSTERS}" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

  # One compile serves both clusters: they differ only by FlagsOverride.json,
  # a plain bundle resource, so the ton-state artifact is repacked from the
  # multichain build (JSON swap + ad-hoc re-sign) instead of a second ~50-min
  # xcodebuild. The multichain variant is the base because it outlives the
  # planned ton-state cluster removal.
  maestro-build:
    name: Build simulator app (both flag variants)
    needs: discover-maestro-clusters
    if: ${{ needs.discover-maestro-clusters.outputs.has_ton_state_shards == 'true' || needs.discover-maestro-clusters.outputs.has_multichain_shards == 'true' }}
    runs-on: macos-26-xlarge
    timeout-minutes: 120
    env:
      MAESTRO_FEATURE_FLAG_OVERRIDES: ${{ secrets.MAESTRO_FEATURE_FLAG_OVERRIDES }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - uses: ./.github/actions/prepare-maestro-build
        with:
          gh-app-id: ${{ secrets.GH_APP_ID }}
          gh-app-private-key: ${{ secrets.GH_APP_PRIVATE_KEY }}
          dev-certificate-p12-base64: ${{ secrets.DEV_CERTIFICATE_P12_BASE64 }}
          dev-certificate-p12-password: ${{ secrets.DEV_CERTIFICATE_P12_PASSWORD }}
          dev-provisioning-profile-base64: ${{ secrets.DEV_PROVISIONING_PROFILE_BASE64 }}

      - name: Build multichain app and repack ton-state variant
        uses: ./.github/actions/build-maestro-simulator
        with:
          artifact-name: maestro-ios-tonkeeper-app-multichain
          overlay-flags-file: maestro_ui_tests/ci/multichain-flags.json
          ensure-multichain-enabled: "true"
          second-artifact-name: ${{ needs.discover-maestro-clusters.outputs.has_ton_state_shards == 'true' && 'maestro-ios-tonkeeper-app' || '' }}
          second-overlay-flags-file: maestro_ui_tests/ci/ton-state-flags.json
          second-ensure-multichain-disabled: "true"

  unit-tests:
    name: Run unit tests
    # Decoupled from the app build on purpose. Unit tests need a *testable*
    # (`@testable import`) build of the SPM package graph — a different artifact
    # than the app build that feeds the Maestro shards — so the two can never
    # share compiled products. Running them as their own job (no `needs:`) lets
    # the unit graph compile and run in parallel with the app build and the
    # Maestro UI shards instead of serializing ahead of them on the critical
    # path. Non-blocking (`non_blocking: true`): a unit failure does NOT redden
    # this run; the result is still surfaced in Slack via the
    # maestro-unit-test-results artifact. Reuses the exact job definition of the
    # standalone `unit-tests.yml` via workflow_call, so the two paths can't drift.
    if: ${{ github.repository != 'tonkeeper/ios' }}
    uses: ./.github/workflows/unit-tests.yml
    secrets: inherit
    with:
      non_blocking: true

  # Canary jobs: one import-to-home smoke per cluster, gating that cluster's
  # shard matrix. An app-wide breakage of wallet setup (the preamble of every
  # flow) fails once here in ~one job instead of burning the timeout budget of
  # every shard plus their per-flow retries. run-maestro-shard's built-in retry
  # gives the canary one flake-resistant second attempt.
  maestro-canary-ton-state:
    name: "[ton] – canary"
    needs: [discover-maestro-clusters, maestro-build]
    if: ${{ needs.discover-maestro-clusters.outputs.has_ton_state_shards == 'true' }}
    runs-on: macos-26-xlarge
    timeout-minutes: 45
    env:
      MAESTRO_DRIVER_STARTUP_TIMEOUT: "180000"
      MAESTRO_CLI_LOG_PATTERN_CONSOLE: '%d{HH:mm:ss.SSS} [%level] %msg%n'
      MAESTRO_CI_ARTIFACTS_DIR: build/maestro-ci-artifacts-canary-ton-state
      MAESTRO_MNEMONIC_PHRASE: ${{ secrets.MAESTRO_MNEMONIC_PHRASE }}
      MAESTRO_WALLET_WITH_MONEY: ${{ secrets.MAESTRO_WALLET_WITH_MONEY }}
      MAESTRO_WALLET_WITH_MONEY_ADDR: ${{ secrets.MAESTRO_WALLET_WITH_MONEY_ADDR }}
      MAESTRO_AUTH: ${{ secrets.MAESTRO_AUTH }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Select Xcode
        uses: ./.github/actions/select-xcode

      - name: Install Maestro CLI
        uses: ./.github/actions/install-maestro-cli

      - name: Run Maestro canary (ton-state)
        uses: ./.github/actions/run-maestro-shard
        with:
          shard-id: canary-ton-state
          flow-rel-path: flows/canary/ton-state
          simulator-artifact: maestro-ios-tonkeeper-app
          artifacts-dir: ${{ env.MAESTRO_CI_ARTIFACTS_DIR }}
          cluster: ton-state

  maestro-canary-multichain:
    name: "[multichain] – canary"
    needs: [discover-maestro-clusters, maestro-build]
    if: ${{ needs.discover-maestro-clusters.outputs.has_multichain_shards == 'true' }}
    runs-on: macos-26-xlarge
    timeout-minutes: 45
    env:
      MAESTRO_DRIVER_STARTUP_TIMEOUT: "180000"
      MAESTRO_CLI_LOG_PATTERN_CONSOLE: '%d{HH:mm:ss.SSS} [%level] %msg%n'
      MAESTRO_CI_ARTIFACTS_DIR: build/maestro-ci-artifacts-canary-multichain
      MAESTRO_MNEMONIC_PHRASE: ${{ secrets.MAESTRO_MNEMONIC_PHRASE }}
      MAESTRO_WALLET_WITH_MONEY: ${{ secrets.MAESTRO_MC_WALLET_MONEY }}
      MAESTRO_WALLET_WITH_MONEY_ADDR: ${{ secrets.MAESTRO_MC_WALLET_MONEY_ADDR }}
      MAESTRO_AUTH: ${{ secrets.MAESTRO_AUTH }}
      MAESTRO_TON_V4: ${{ secrets.MAESTRO_TON_V4 }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Select Xcode
        uses: ./.github/actions/select-xcode

      - name: Install Maestro CLI
        uses: ./.github/actions/install-maestro-cli

      - name: Run Maestro canary (multichain)
        uses: ./.github/actions/run-maestro-shard
        with:
          shard-id: canary-multichain
          flow-rel-path: flows/canary/multichain
          simulator-artifact: maestro-ios-tonkeeper-app-multichain
          artifacts-dir: ${{ env.MAESTRO_CI_ARTIFACTS_DIR }}
          cluster: multichain

  maestro-ui-tests-ton-state:
    name: "[ton] – ${{ matrix.label }}"
    needs: [discover-maestro-clusters, maestro-build, maestro-canary-ton-state]
    if: ${{ needs.discover-maestro-clusters.outputs.has_ton_state_shards == 'true' }}
    runs-on: macos-26-xlarge
    timeout-minutes: 120
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include: ${{ fromJson(needs.discover-maestro-clusters.outputs.ton_state_shards) }}
    env:
      MAESTRO_DRIVER_STARTUP_TIMEOUT: "180000"
      MAESTRO_CLI_LOG_PATTERN_CONSOLE: '%d{HH:mm:ss.SSS} [%level] %msg%n'
      MAESTRO_CI_ARTIFACTS_DIR: build/maestro-ci-artifacts-ton-state-${{ matrix.id }}
      MAESTRO_MNEMONIC_PHRASE: ${{ secrets.MAESTRO_MNEMONIC_PHRASE }}
      MAESTRO_WALLET_WITH_MONEY: ${{ secrets.MAESTRO_WALLET_WITH_MONEY }}
      MAESTRO_WALLET_WITH_MONEY_ADDR: ${{ secrets.MAESTRO_WALLET_WITH_MONEY_ADDR }}
      MAESTRO_AUTH: ${{ secrets.MAESTRO_AUTH }}
      MAESTRO_RECIEVE_WALLET: ${{ secrets.MAESTRO_RECIEVE_WALLET }}
      MAESTRO_TESTNET_MNEM: ${{ secrets.MAESTRO_TESTNET_MNEM }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Select Xcode
        uses: ./.github/actions/select-xcode

      - name: Install Maestro CLI
        uses: ./.github/actions/install-maestro-cli

      - name: Run Maestro shard (ton-state)
        uses: ./.github/actions/run-maestro-shard
        with:
          shard-id: ${{ matrix.id }}
          flow-rel-path: ${{ matrix.path }}
          simulator-artifact: maestro-ios-tonkeeper-app
          artifacts-dir: ${{ env.MAESTRO_CI_ARTIFACTS_DIR }}
          cluster: ton-state

  maestro-ui-tests-multichain:
    name: "[multichain] – ${{ matrix.label }}"
    needs: [discover-maestro-clusters, maestro-build, maestro-canary-multichain]
    if: ${{ needs.discover-maestro-clusters.outputs.has_multichain_shards == 'true' }}
    runs-on: macos-26-xlarge
    timeout-minutes: 120
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include: ${{ fromJson(needs.discover-maestro-clusters.outputs.multichain_shards) }}
    env:
      MAESTRO_DRIVER_STARTUP_TIMEOUT: "180000"
      MAESTRO_CLI_LOG_PATTERN_CONSOLE: '%d{HH:mm:ss.SSS} [%level] %msg%n'
      MAESTRO_CI_ARTIFACTS_DIR: build/maestro-ci-artifacts-multichain-${{ matrix.id }}
      MAESTRO_MNEMONIC_PHRASE: ${{ secrets.MAESTRO_MNEMONIC_PHRASE }}
      MAESTRO_WALLET_WITH_MONEY: ${{ secrets.MAESTRO_MC_WALLET_MONEY }}
      MAESTRO_WALLET_WITH_MONEY_ADDR: ${{ secrets.MAESTRO_MC_WALLET_MONEY_ADDR }}
      MAESTRO_AUTH: ${{ secrets.MAESTRO_AUTH }}
      MAESTRO_RECIEVE_WALLET: ${{ secrets.MAESTRO_RECIEVE_WALLET }}
      MAESTRO_TESTNET_MNEM: ${{ secrets.MAESTRO_TESTNET_MNEM }}
      MAESTRO_TON_V4: ${{ secrets.MAESTRO_TON_V4 }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Select Xcode
        uses: ./.github/actions/select-xcode

      - name: Install Maestro CLI
        uses: ./.github/actions/install-maestro-cli

      - name: Run Maestro shard (multichain)
        uses: ./.github/actions/run-maestro-shard
        with:
          shard-id: ${{ matrix.id }}
          flow-rel-path: ${{ matrix.path }}
          simulator-artifact: maestro-ios-tonkeeper-app-multichain
          artifacts-dir: ${{ env.MAESTRO_CI_ARTIFACTS_DIR }}
          cluster: multichain

  discover-failed-shards:
    name: Discover failed Maestro shards for auto-rerun
    needs: [discover-maestro-clusters, maestro-ui-tests-ton-state, maestro-ui-tests-multichain]
    runs-on: ubuntu-latest
    if: ${{ always() && !cancelled() && github.repository != 'tonkeeper/ios' }}
    outputs:
      failed_shards: ${{ steps.collect.outputs.failed_shards }}
      has_failed_shards: ${{ steps.collect.outputs.has_failed_shards }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Download per-shard failed-state artifacts
        uses: actions/download-artifact@v6
        continue-on-error: true
        with:
          pattern: maestro-failed-state-*
          merge-multiple: false
          path: build/maestro-failed-states

      - name: Collect failed shards (both clusters)
        id: collect
        shell: bash
        env:
          TON_STATE_SHARDS: ${{ needs.discover-maestro-clusters.outputs.ton_state_shards }}
          MULTICHAIN_SHARDS: ${{ needs.discover-maestro-clusters.outputs.multichain_shards }}
        run: |
          set -euo pipefail
          ROOT="${{ github.workspace }}/build/maestro-failed-states"
          mkdir -p "$ROOT"
          json="$(python3 maestro_ui_tests/scripts/ci/list_failed_shards.py --root "$ROOT")"
          json="${json//$'\n'/}"
          failed="$(ALL_FAILED="$json" python3 - <<'PY'
          import json, os
          all_failed = json.loads(os.environ["ALL_FAILED"])
          ton = {s["id"]: s for s in json.loads(os.environ.get("TON_STATE_SHARDS") or "[]")}
          mc = {s["id"]: s for s in json.loads(os.environ.get("MULTICHAIN_SHARDS") or "[]")}
          artifacts = {
              "ton-state": "maestro-ios-tonkeeper-app",
              "multichain": "maestro-ios-tonkeeper-app-multichain",
          }
          out = []
          skipped = []
          for sid in all_failed:
              if sid in ton:
                  meta = ton[sid]
                  cluster = "ton-state"
              elif sid in mc:
                  meta = mc[sid]
                  cluster = "multichain"
              else:
                  continue
              if meta.get("skip_auto_rerun"):
                  skipped.append(sid)
                  continue
              out.append({
                  "id": sid,
                  "path": meta["path"],
                  "cluster": cluster,
                  "artifact": artifacts[cluster],
              })
          if skipped:
              print(f"skip_auto_rerun: {', '.join(skipped)}", file=__import__('sys').stderr)
          # A majority of shards failing is a systemic breakage (app-wide UI or
          # environment change), not per-flow flakiness — an auto-rerun would
          # replay the same failure at full price. Surface it and skip the rerun.
          total = len(ton) + len(mc)
          if out and total and len(out) * 2 > total:
              import sys
              print(f"systemic failure: {len(out)} of {total} shards failed; skipping auto-rerun", file=sys.stderr)
              summary_path = os.environ.get("GITHUB_STEP_SUMMARY")
              if summary_path:
                  with open(summary_path, "a") as fh:
                      fh.write(f"Systemic failure: {len(out)} of {total} shards failed — auto-rerun skipped (a rerun cannot fix an app-wide breakage).\n\n")
              out = []
          print(json.dumps(out))
          PY
          )"
          [[ -n "$failed" ]] || failed="[]"
          echo "failed_shards=${failed}" >> "$GITHUB_OUTPUT"
          if [[ "$failed" == "[]" ]]; then
            echo "has_failed_shards=false" >> "$GITHUB_OUTPUT"
            echo "No failed shards eligible for auto-rerun." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "has_failed_shards=true" >> "$GITHUB_OUTPUT"
            echo "Failed shards queued for auto-rerun: $failed" >> "$GITHUB_STEP_SUMMARY"
          fi

  maestro-rerun-failed-shards:
    name: Maestro auto-rerun — ${{ matrix.id }}
    needs:
      - discover-maestro-clusters
      - maestro-build
      - maestro-ui-tests-ton-state
      - maestro-ui-tests-multichain
      - discover-failed-shards
    if: ${{ always() && !cancelled() && github.repository != 'tonkeeper/ios' && needs.discover-failed-shards.outputs.has_failed_shards == 'true' }}
    runs-on: macos-26-xlarge
    timeout-minutes: 60
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include: ${{ fromJson(needs.discover-failed-shards.outputs.failed_shards) }}
    env:
      MAESTRO_DRIVER_STARTUP_TIMEOUT: "180000"
      MAESTRO_CLI_LOG_PATTERN_CONSOLE: '%d{HH:mm:ss.SSS} [%level] %msg%n'
      MAESTRO_CI_ARTIFACTS_DIR: build/maestro-ci-artifacts-rerun-${{ matrix.id }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Select Xcode
        uses: ./.github/actions/select-xcode

      - name: Install Maestro CLI
        uses: ./.github/actions/install-maestro-cli

      - name: Download failed-state artifact for this shard
        uses: actions/download-artifact@v6
        with:
          name: maestro-failed-state-${{ matrix.id }}
          path: ${{ github.workspace }}/build/maestro-rerun-state/${{ matrix.id }}

      - name: Fetch simulator app
        uses: ./.github/actions/fetch-simulator-app
        with:
          artifact-name: ${{ matrix.artifact }}

      - name: Prepare Maestro simulator
        uses: ./.github/actions/prepare-maestro-simulator
        with:
          artifacts-dir: ${{ env.MAESTRO_CI_ARTIFACTS_DIR }}

      - name: Re-run failed Maestro flows for ${{ matrix.id }}
        id: rerun
        shell: bash
        env:
          ART: ${{ github.workspace }}/${{ env.MAESTRO_CI_ARTIFACTS_DIR }}
          MAESTRO_NATIVE_TOKEN_ENV: ${{ github.workspace }}/maestro_ui_tests/ci/native_token_env.sh
          PB_COPY_SCRIPT: ${{ github.workspace }}/maestro_ui_tests/scripts/ci/simulator_pbcopy_phrase.sh
          PASSWORD_KEY: "5"
          MAESTRO_MNEMONIC_PHRASE: ${{ secrets.MAESTRO_MNEMONIC_PHRASE }}
          MAESTRO_WALLET_WITH_MONEY: ${{ matrix.cluster == 'multichain' && secrets.MAESTRO_MC_WALLET_MONEY || secrets.MAESTRO_WALLET_WITH_MONEY }}
          MAESTRO_WALLET_WITH_MONEY_ADDR: ${{ matrix.cluster == 'multichain' && secrets.MAESTRO_MC_WALLET_MONEY_ADDR || secrets.MAESTRO_WALLET_WITH_MONEY_ADDR }}
          MAESTRO_AUTH: ${{ secrets.MAESTRO_AUTH }}
          MAESTRO_RECIEVE_WALLET: ${{ secrets.MAESTRO_RECIEVE_WALLET }}
          MAESTRO_TESTNET_MNEM: ${{ secrets.MAESTRO_TESTNET_MNEM }}
          MAESTRO_TON_V4: ${{ secrets.MAESTRO_TON_V4 }}
        run: |
          set -uo pipefail
          mkdir -p "$ART"
          STATE_DIR="${{ github.workspace }}/build/maestro-rerun-state/${{ matrix.id }}"
          PATHS_FILE="$STATE_DIR/failed_paths.txt"
          if [[ ! -s "$PATHS_FILE" ]]; then
            echo "::warning::Auto-rerun received no failed paths for ${{ matrix.id }}; nothing to do."
            printf '%s' "0" > "$ART/maestro-exit.txt"
            exit 0
          fi
          FLOW_DIR="${{ github.workspace }}/maestro_ui_tests/${{ matrix.path }}"
          resolved=()
          while IFS= read -r raw || [[ -n "$raw" ]]; do
            raw="${raw//$'\r'/}"
            [[ -n "$raw" ]] || continue
            base="$(basename "$raw")"
            candidate="$FLOW_DIR/$base"
            if [[ -f "$candidate" ]]; then
              resolved+=("$candidate")
            else
              echo "::warning::Auto-rerun: ${base} not found under ${FLOW_DIR}; skipping."
            fi
          done < "$PATHS_FILE"
          if [[ ${#resolved[@]} -eq 0 ]]; then
            echo "::warning::Auto-rerun: no resolvable failed paths after mapping; nothing to do."
            printf '%s' "0" > "$ART/maestro-exit.txt"
            exit 0
          fi
          printf '%s\n' "${resolved[@]}" > "$ART/maestro-retry-flow-paths.txt"
          echo "::notice::Auto-rerun ${{ matrix.id }}: ${#resolved[@]} flow(s)"
          set +e
          bash "${{ github.workspace }}/maestro_ui_tests/ci/run_maestro_failed_paths.sh" "${resolved[@]}"
          exit_code=$?
          set -e
          printf '%s' "$exit_code" > "$ART/maestro-rerun-exit.txt"
          exit "$exit_code"

      - name: Write Maestro CI summary (rerun)
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          ART="${{ github.workspace }}/${{ env.MAESTRO_CI_ARTIFACTS_DIR }}"
          SCRIPTS="${{ github.workspace }}/maestro_ui_tests/scripts"
          CODE=1
          if [[ -f "$ART/maestro-exit.txt" ]]; then
            read -r _code < "$ART/maestro-exit.txt" || _code=1
            if [[ -n "$_code" && "$_code" =~ ^[0-9]+$ ]]; then
              CODE="$_code"
            fi
          fi
          if [[ -f "$ART/maestro-retry.log" ]]; then
            python3 "$SCRIPTS/ci/summarize_maestro_log.py" \
              --log "$ART/maestro-retry.log" \
              --out "$ART/maestro-ci-summary.txt" \
              --flow-group "${{ matrix.id }}" \
              --flow-dir "${{ github.workspace }}/maestro_ui_tests/${{ matrix.path }}" \
              --exit "$CODE"
            cp -f "$ART/maestro-ci-summary.txt" "$ART/maestro-ci-summary-retry.txt"
          else
            echo "No $ART/maestro-retry.log; auto-rerun produced no summary." >&2
          fi
          if [[ -f "$ART/maestro-ci-summary.txt" && -n "${GITHUB_STEP_SUMMARY:-}" ]]; then
            echo "### Maestro auto-rerun (${{ matrix.id }})" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            cat "$ART/maestro-ci-summary.txt" >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Stop simulator screen recording and log stream
        if: always()
        uses: ./.github/actions/stop-maestro-recording
        with:
          artifacts-dir: ${{ env.MAESTRO_CI_ARTIFACTS_DIR }}

      # Same rule as run-maestro-shard: a green rerun's video is never watched.
      - name: Drop screen recording for passing rerun
        if: ${{ always() && steps.rerun.outcome == 'success' }}
        shell: bash
        run: rm -f "${{ github.workspace }}/${{ env.MAESTRO_CI_ARTIFACTS_DIR }}/simulator-run.mp4"

      - name: Stage rerun artifacts for upload
        if: always()
        uses: ./.github/actions/stage-maestro-artifacts
        with:
          source-dir: ${{ github.workspace }}/${{ env.MAESTRO_CI_ARTIFACTS_DIR }}
          staging-dir: ${{ github.workspace }}/build/maestro-ci-rerun-upload/${{ matrix.id }}
          files: >-
            maestro-retry.log
            maestro-ci-summary.txt
            maestro-ci-summary-retry.txt
            maestro-exit.txt
            maestro-rerun-exit.txt
            maestro-retry-flow-paths.txt
            record-started-at.epoch
            simulator-run.mp4
            simulator-unified.log

      - name: Upload Maestro auto-rerun artifacts
        id: maestro_ci_rerun_upload
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: maestro-ci-rerun-${{ github.run_id }}-${{ matrix.id }}
          path: build/maestro-ci-rerun-upload/${{ matrix.id }}
          retention-days: 14
          if-no-files-found: warn

      - name: Link auto-rerun artifact in job summary
        if: always()
        uses: ./.github/actions/link-maestro-artifact
        with:
          artifact-url: ${{ steps.maestro_ci_rerun_upload.outputs.artifact-url }}
          artifact-name: maestro-ci-rerun-${{ github.run_id }}-${{ matrix.id }}
          description: "auto-rerun `maestro-retry.log`, screenshots, `simulator-run.mp4`, `maestro-ci-summary.txt`"

  pipeline-gate:
    name: Maestro pipeline gate
    needs:
      - maestro-build
      - maestro-canary-ton-state
      - maestro-canary-multichain
      - maestro-ui-tests-ton-state
      - maestro-ui-tests-multichain
      - discover-failed-shards
      - maestro-rerun-failed-shards
    if: ${{ always() && !cancelled() && github.repository != 'tonkeeper/ios' }}
    runs-on: ubuntu-latest
    steps:
      - name: Require Maestro jobs to pass
        shell: bash
        run: |
          set -euo pipefail
          check_job() {
            local name="$1"
            local result="$2"
            if [[ "$result" == "success" || "$result" == "skipped" ]]; then
              echo "$name: $result"
              return 0
            fi
            echo "::error::$name failed with result=$result (blocks pipeline gate)"
            return 1
          }
          check_job "maestro-build" "${{ needs.maestro-build.result }}"
          # A failed canary skips its whole shard matrix, and "skipped" passes
          # check_job — the canaries must be checked here or the gate would go
          # green on a run where nothing was tested.
          check_job "maestro-canary-ton-state" "${{ needs.maestro-canary-ton-state.result }}"
          check_job "maestro-canary-multichain" "${{ needs.maestro-canary-multichain.result }}"
          check_job "maestro-ui-tests-ton-state" "${{ needs.maestro-ui-tests-ton-state.result }}"
          check_job "maestro-ui-tests-multichain" "${{ needs.maestro-ui-tests-multichain.result }}"
          check_job "discover-failed-shards" "${{ needs.discover-failed-shards.result }}"
          check_job "maestro-rerun-failed-shards" "${{ needs.maestro-rerun-failed-shards.result }}"

  maestro-slack-notify:
    name: Post Maestro results to Slack
    runs-on: ubuntu-latest
    needs:
      - maestro-build
      - maestro-ui-tests-ton-state
      - maestro-ui-tests-multichain
      - unit-tests
      - discover-failed-shards
      - maestro-rerun-failed-shards
      - pipeline-gate
    if: ${{ always() && !cancelled() && github.repository != 'tonkeeper/ios' }}
    permissions:
      actions: read
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Download unit-test results
        uses: actions/download-artifact@v6
        continue-on-error: true
        with:
          name: maestro-unit-test-results
          path: build/maestro-slack-unit-tests

      - name: Download Maestro CI first-attempt artifacts
        uses: actions/download-artifact@v6
        continue-on-error: true
        with:
          pattern: maestro-ci-${{ github.run_id }}-*
          merge-multiple: false
          path: build/maestro-slack-artifacts/first-attempt

      - name: Download Maestro CI auto-rerun artifacts
        uses: actions/download-artifact@v6
        continue-on-error: true
        with:
          pattern: maestro-ci-rerun-${{ github.run_id }}-*
          merge-multiple: false
          path: build/maestro-slack-artifacts/rerun

      - name: Post status to tk-autotests-status
        continue-on-error: true
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_CHANNEL: ${{ secrets.SLACK_AUTOTESTS_CHANNEL }}
          MAESTRO_BUILD_OK: ${{ (needs.maestro-build.result == 'success' || needs.maestro-build.result == 'skipped') && 'true' || 'false' }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${SLACK_BOT_TOKEN:-}" ]]; then
            echo "::warning::SLACK_BOT_TOKEN is not set; skipping tk-autotests-status notification."
            exit 0
          fi
          CHANNEL="${SLACK_CHANNEL:-tk-autotests-status}"
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          python3 maestro_ui_tests/ci/slack_bot/post_maestro_slack_status.py \
            --artifacts-dir "${{ github.workspace }}/build/maestro-slack-artifacts" \
            --run-url "$RUN_URL" \
            --platform "iOS" \
            --channel "$CHANNEL" \
            --build-ok "$MAESTRO_BUILD_OK" \
            --unit-tests-dir "${{ github.workspace }}/build/maestro-slack-unit-tests"
