name: Select Xcode
description: Select a specific Xcode version and export DEVELOPER_DIR for later steps.
inputs:
  xcode-path:
    description: Path to the Xcode Developer directory.
    required: false
    default: /Applications/Xcode_26.3.app/Contents/Developer
runs:
  using: composite
  steps:
    - name: Select Xcode
      shell: bash
      run: |
        set -euo pipefail
        XCODE_PATH="${{ inputs.xcode-path }}"
        if [[ ! -d "$XCODE_PATH" ]]; then
          echo "Xcode is not available at $XCODE_PATH"
          exit 1
        fi
        export DEVELOPER_DIR="$XCODE_PATH"
        echo "DEVELOPER_DIR=$XCODE_PATH" >> "$GITHUB_ENV"
        xcodebuild -version
