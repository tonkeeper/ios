name: Fetch simulator app
description: Download and unzip the Maestro simulator app artifact, exporting MAESTRO_APP_PATH.
inputs:
  artifact-name:
    description: Name of the uploaded simulator app artifact.
    required: false
    default: maestro-ios-tonkeeper-app
  download-path:
    description: Directory to download the artifact into.
    required: false
    default: build/app-download
runs:
  using: composite
  steps:
    - name: Download simulator app
      uses: actions/download-artifact@v6
      with:
        name: ${{ inputs.artifact-name }}
        path: ${{ inputs.download-path }}

    - name: Unzip app bundle
      shell: bash
      env:
        DOWNLOAD_PATH: ${{ inputs.download-path }}
      run: |
        set -euo pipefail
        mkdir -p "$RUNNER_TEMP/maestro-app"
        unzip -q -o "$(find "$DOWNLOAD_PATH" -name '*.zip' -print -quit)" -d "$RUNNER_TEMP/maestro-app"
        APP="$(find "$RUNNER_TEMP/maestro-app" -type d -name '*.app' -print -quit)"
        if [[ -z "$APP" ]]; then
          echo "No .app inside zip"
          find "$RUNNER_TEMP/maestro-app" -type d || true
          exit 1
        fi
        echo "MAESTRO_APP_PATH=$APP" >> "$GITHUB_ENV"
