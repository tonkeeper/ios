name: Install Maestro CLI
description: Set up Java, install the Maestro CLI, and verify the installation.
inputs:
  java-version:
    description: Java version to install.
    required: false
    default: "17"
  java-distribution:
    description: Java distribution to install.
    required: false
    default: temurin
runs:
  using: composite
  steps:
    - name: Set up Java
      uses: actions/setup-java@v5
      with:
        distribution: ${{ inputs.java-distribution }}
        java-version: ${{ inputs.java-version }}

    - name: Install Maestro CLI
      shell: bash
      run: |
        curl -fsSL "https://get.maestro.mobile.dev" | bash
        echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"

    - name: Verify Maestro installation
      shell: bash
      run: maestro --version
