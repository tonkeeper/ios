name: Stop Maestro recording
description: Stop the simulator screen recording and the Tonkeeper log stream started earlier.
inputs:
  artifacts-dir:
    description: Path (relative to the workspace) for Maestro CI artifacts.
    required: true
runs:
  using: composite
  steps:
    - name: Stop simulator screen recording and log stream
      shell: bash
      env:
        ARTIFACTS_DIR: ${{ inputs.artifacts-dir }}
      run: |
        set -euo pipefail
        ART="${{ github.workspace }}/$ARTIFACTS_DIR"
        PID_PATH="$ART/record.pid"
        LOG_PID_PATH="$ART/log-stream.pid"
        if [[ -f "$PID_PATH" ]]; then
          kill -SIGINT "$(cat "$PID_PATH")" 2>/dev/null || true
          sleep 5
        fi
        if [[ -f "$LOG_PID_PATH" ]]; then
          kill -SIGTERM "$(cat "$LOG_PID_PATH")" 2>/dev/null || true
          sleep 2
        fi
