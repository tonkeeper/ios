name: Link Maestro artifact in job summary
description: Append a download link for the uploaded Maestro artifact to the job summary.
inputs:
  artifact-url:
    description: URL of the uploaded artifact (from upload-artifact outputs).
    required: true
  artifact-name:
    description: Display name for the artifact link.
    required: true
  description:
    description: Short description of the artifact contents shown after the link.
    required: true
runs:
  using: composite
  steps:
    - name: Link Maestro artifact in job summary
      shell: bash
      env:
        ARTIFACT_URL: ${{ inputs.artifact-url }}
        ARTIFACT_NAME: ${{ inputs.artifact-name }}
        ARTIFACT_DESCRIPTION: ${{ inputs.description }}
      run: |
        set -euo pipefail
        if [[ -z "${ARTIFACT_URL:-}" ]]; then
          echo "::warning::No artifact-url from upload step; skip download link in job summary."
          exit 0
        fi
        if [[ -n "${GITHUB_STEP_SUMMARY:-}" ]]; then
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "**[${ARTIFACT_NAME}](${ARTIFACT_URL})** — ${ARTIFACT_DESCRIPTION}" >> "$GITHUB_STEP_SUMMARY"
        fi
