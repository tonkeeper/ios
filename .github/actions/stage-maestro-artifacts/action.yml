name: Stage Maestro artifacts
description: >-
  Copy the named Maestro artifact files (when present) plus every screenshot
  found under the source directory into a staging directory for upload.
inputs:
  source-dir:
    description: Directory that holds the produced Maestro artifacts.
    required: true
  staging-dir:
    description: Directory to copy artifacts into for upload.
    required: true
  files:
    description: Whitespace-separated list of file names (relative to source-dir) to copy if present.
    required: true
runs:
  using: composite
  steps:
    - name: Stage Maestro artifacts
      shell: bash
      env:
        SRC: ${{ inputs.source-dir }}
        STAGING: ${{ inputs.staging-dir }}
        FILES: ${{ inputs.files }}
      run: |
        set -euo pipefail
        mkdir -p "$STAGING"
        for f in $FILES; do
          if [[ -f "$SRC/$f" ]]; then
            cp -f "$SRC/$f" "$STAGING/"
          fi
        done
        while IFS= read -r -d '' img; do
          rel="${img#"$SRC"/}"
          dest="$STAGING/$(dirname "$rel")"
          mkdir -p "$dest"
          cp -f "$img" "$dest/"
        done < <(find "$SRC" -type f \( -iname '*.png' -o -iname '*.jpg' -o -iname '*.jpeg' -o -iname '*.webp' \) -print0 2>/dev/null || true)
