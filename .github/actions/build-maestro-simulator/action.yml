name: Build Maestro simulator app
description: Build Keeper.app for iOS Simulator with Maestro feature-flag overrides.

inputs:
  artifact-name:
    description: Uploaded artifact name for the zipped .app bundle.
    required: true
  overlay-flags-json:
    description: JSON object merged on top of MAESTRO_FEATURE_FLAG_OVERRIDES. Avoid values that start with `{` in `with:` — use overlay-flags-file instead.
    required: false
    default: '{}'
  overlay-flags-file:
    description: Repo-relative JSON file merged on top of MAESTRO_FEATURE_FLAG_OVERRIDES (same shape as disable_swap / disable_battery).
    required: false
    default: ''
  ensure-multichain-disabled:
    description: Force featureFlags.multichainEnabled to false in FlagsOverride.json.
    required: false
    default: 'false'
  ensure-multichain-enabled:
    description: Force featureFlags.multichainEnabled to true in FlagsOverride.json (outranks keys/all).
    required: false
    default: 'false'
  # The clusters differ only by FlagsOverride.json — a plain bundle resource the
  # app JSON-decodes at runtime (StaticFlagOverrides.loadFromBundle). A second
  # variant therefore needs no second compile: swap the JSON in the built .app,
  # re-seal the signature, zip. Empty second-artifact-name skips all of it.
  second-artifact-name:
    description: When set, also upload a second artifact repacked from the same build with different flags.
    required: false
    default: ''
  second-overlay-flags-file:
    description: Repo-relative JSON file merged on top of MAESTRO_FEATURE_FLAG_OVERRIDES for the second variant.
    required: false
    default: ''
  second-ensure-multichain-disabled:
    description: Force featureFlags.multichainEnabled to false in the second variant's FlagsOverride.json.
    required: false
    default: 'false'
  second-ensure-multichain-enabled:
    description: Force featureFlags.multichainEnabled to true in the second variant's FlagsOverride.json.
    required: false
    default: 'false'
  derived-data:
    description: Xcode derived data path (relative to repo root).
    required: false
    default: build/DerivedData-maestro

runs:
  using: composite
  steps:
    - name: Write Maestro feature flag overrides
      shell: bash
      env:
        MAESTRO_FEATURE_FLAG_OVERRIDES: ${{ env.MAESTRO_FEATURE_FLAG_OVERRIDES }}
        OVERLAY_FLAGS_JSON: ${{ inputs.overlay-flags-json }}
        OVERLAY_FLAGS_FILE: ${{ inputs.overlay-flags-file }}
        ENSURE_MULTICHAIN_DISABLED: ${{ inputs.ensure-multichain-disabled }}
        ENSURE_MULTICHAIN_ENABLED: ${{ inputs.ensure-multichain-enabled }}
      run: |
        set -euo pipefail
        dest="${{ github.workspace }}/Tonkeeper/Resources/FlagsOverride.json"
        args=(--dest "$dest")
        if [[ -n "${MAESTRO_FEATURE_FLAG_OVERRIDES:-}" ]]; then
          args+=(--base-json "$MAESTRO_FEATURE_FLAG_OVERRIDES")
        fi
        if [[ -n "${OVERLAY_FLAGS_FILE:-}" ]]; then
          overlay_path="${OVERLAY_FLAGS_FILE}"
          if [[ "$overlay_path" != /* ]]; then
            overlay_path="${{ github.workspace }}/${overlay_path}"
          fi
          args+=(--overlay-json-file "$overlay_path")
        fi
        if [[ -n "${OVERLAY_FLAGS_JSON:-}" && "${OVERLAY_FLAGS_JSON}" != "{}" ]]; then
          args+=(--overlay-json "$OVERLAY_FLAGS_JSON")
        fi
        if [[ "$ENSURE_MULTICHAIN_DISABLED" == "true" ]]; then
          args+=(--ensure-multichain-disabled)
        fi
        if [[ "$ENSURE_MULTICHAIN_ENABLED" == "true" ]]; then
          args+=(--ensure-multichain-enabled)
        fi
        python3 "${{ github.workspace }}/maestro_ui_tests/scripts/ci/write_maestro_flags_override.py" "${args[@]}"
        python3 -c "import json; json.load(open('$dest'))"

    - name: Build Tonkeeper for iOS Simulator
      shell: bash
      env:
        GIT_TERMINAL_PROMPT: "0"
        GCM_INTERACTIVE: Never
        HOME: ${{ github.workspace }}/build/codex_home
        SWIFTPM_CACHE_PATH: ${{ github.workspace }}/build/swiftpm-cache
        SWIFTPM_CONFIG_DIR: ${{ github.workspace }}/build/swiftpm-config
        CLANG_MODULE_CACHE_PATH: ${{ github.workspace }}/build/clang-module-cache
        CLONED_SOURCE_PACKAGES_DIR: ${{ github.workspace }}/build/SourcePackages
        DERIVED_DATA: ${{ inputs.derived-data }}
      run: |
        set -euo pipefail
        security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
        export NSUnbufferedIO=YES
        xcodebuild \
          -scmProvider system \
          -disableAutomaticPackageResolution \
          -onlyUsePackageVersionsFromResolvedFile \
          -project Tonkeeper.xcodeproj \
          -scheme Tonkeeper \
          -configuration TonkeeperDebug \
          -destination 'generic/platform=iOS Simulator' \
          -derivedDataPath "${{ github.workspace }}/$DERIVED_DATA" \
          -clonedSourcePackagesDirPath "$CLONED_SOURCE_PACKAGES_DIR" \
          ARCHS=arm64 \
          COMPILER_INDEX_STORE_ENABLE=NO \
          build

    - name: Zip Keeper.app for Maestro CI
      shell: bash
      env:
        DERIVED_DATA: ${{ inputs.derived-data }}
      run: |
        set -euo pipefail
        APP="$(find "${{ github.workspace }}/$DERIVED_DATA/Build/Products" -type d -name 'Keeper.app' -print -quit)"
        if [[ -z "$APP" ]]; then
          echo "Keeper.app not found"
          exit 1
        fi
        mkdir -p build
        (cd "$(dirname "$APP")" && zip -rq "${{ github.workspace }}/build/TonkeeperSimulator.zip" "$(basename "$APP")")

    - name: Upload simulator app
      uses: actions/upload-artifact@v6
      with:
        name: ${{ inputs.artifact-name }}
        path: build/TonkeeperSimulator.zip
        if-no-files-found: error

    - name: Repack second flag variant
      if: ${{ inputs.second-artifact-name != '' }}
      shell: bash
      env:
        MAESTRO_FEATURE_FLAG_OVERRIDES: ${{ env.MAESTRO_FEATURE_FLAG_OVERRIDES }}
        SECOND_OVERLAY_FLAGS_FILE: ${{ inputs.second-overlay-flags-file }}
        SECOND_ENSURE_MULTICHAIN_DISABLED: ${{ inputs.second-ensure-multichain-disabled }}
        SECOND_ENSURE_MULTICHAIN_ENABLED: ${{ inputs.second-ensure-multichain-enabled }}
        DERIVED_DATA: ${{ inputs.derived-data }}
      run: |
        set -euo pipefail
        APP="$(find "${{ github.workspace }}/$DERIVED_DATA/Build/Products" -type d -name 'Keeper.app' -print -quit)"
        if [[ -z "$APP" ]]; then
          echo "Keeper.app not found"
          exit 1
        fi
        dest="$RUNNER_TEMP/FlagsOverride-second.json"
        args=(--dest "$dest")
        if [[ -n "${MAESTRO_FEATURE_FLAG_OVERRIDES:-}" ]]; then
          args+=(--base-json "$MAESTRO_FEATURE_FLAG_OVERRIDES")
        fi
        if [[ -n "${SECOND_OVERLAY_FLAGS_FILE:-}" ]]; then
          overlay_path="${SECOND_OVERLAY_FLAGS_FILE}"
          if [[ "$overlay_path" != /* ]]; then
            overlay_path="${{ github.workspace }}/${overlay_path}"
          fi
          args+=(--overlay-json-file "$overlay_path")
        fi
        if [[ "$SECOND_ENSURE_MULTICHAIN_DISABLED" == "true" ]]; then
          args+=(--ensure-multichain-disabled)
        fi
        if [[ "$SECOND_ENSURE_MULTICHAIN_ENABLED" == "true" ]]; then
          args+=(--ensure-multichain-enabled)
        fi
        python3 "${{ github.workspace }}/maestro_ui_tests/scripts/ci/write_maestro_flags_override.py" "${args[@]}"
        python3 -c "import json; json.load(open('$dest'))"
        cp -f "$dest" "$APP/FlagsOverride.json"
        # Replacing a bundled resource breaks the code-signature resource seal;
        # re-seal ad hoc — the simulator accepts ad-hoc signatures.
        codesign --force --sign - "$APP"
        (cd "$(dirname "$APP")" && zip -rq "${{ github.workspace }}/build/TonkeeperSimulatorSecond.zip" "$(basename "$APP")")

    - name: Upload second-variant simulator app
      if: ${{ inputs.second-artifact-name != '' }}
      uses: actions/upload-artifact@v6
      with:
        name: ${{ inputs.second-artifact-name }}
        path: build/TonkeeperSimulatorSecond.zip
        if-no-files-found: error
