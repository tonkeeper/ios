openapi: 3.0.3
info:
  title: tk-perps API
  version: 1.0.536
  description: An aggregating BFF proxy sitting between self-custody TonKeeper clients and the Lighter perpetuals exchange. It serves screen-shaped read responses so the client can render a full screen in a single round-trip.
servers:
  - url: https://{host}/tk-perps/public-api/v1
    variables:
      host:
        default: api.example.com
tags:
  - name: account
    description: Trading account state and lifecycle.
  - name: screens
    description: Aggregated screen-shaped read responses.
  - name: activity
    description: Chronological account activity feed.
  - name: transactions
    description: Transactions the client signs itself — what it needs to sign one, and reporting what it submitted.
  - name: funding
    description: Funding a perps account — deposits and their progress.
  - name: positions
    description: The caller's positions, one resource per venue and market.
  - name: orders
    description: The caller's orders — what is resting on the book, and what became of one.
  - name: portfolio
    description: Balance, positions and open orders in a single read.
  - name: orderbook
    description: Order book depth, truncated to what a given notional consumes.
  - name: integrator
    description: Partner attribution — what the client signs into its transactions so fees accrue here.
paths:
  /account:
    get:
      tags:
        - account
      operationId: getAccount
      summary: Get the caller's Lighter main account
      description: |-
        Resolves the caller's Lighter main account by the L1 (Ethereum) address bound to the wallet and returns a snapshot: account index, balances, and whether an L2 signing key is registered. The two are independent: status is Lighter's own account status, while has_l2_key is read from the account's API keys. One user maps to exactly one Lighter main account.
        This is also what a client polls while it waits for an account to exist: the index is resolved against Lighter live for as long as the binding has none, so not_registered turns into an account as soon as there is one. A wallet with no binding at all is answered not_registered too, and stays so until POST /account/bind records one -- a deposit made outside this service tells us nothing by itself.
      parameters:
        - $ref: '#/components/parameters/WalletIDHeader'
        - $ref: '#/components/parameters/WalletAuthHeader'
      responses:
        "200":
          description: Account snapshot.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Account'
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "500":
          $ref: '#/components/responses/InternalError'
        "503":
          $ref: '#/components/responses/ServiceUnavailable'
  /account/bind:
    post:
      tags:
        - account
      operationId: bindAccount
      summary: Bind the caller's wallet to its L1 address
      description: |-
        Records which L1 (Ethereum) address a wallet owns, and the Lighter account that address holds when there is one. It is the only endpoint whose whole job is that binding; everywhere else it is a side effect of a write that needed it anyway.
        A caller whose Lighter account was funded outside this service has no other way in. Every read here answers from the binding, so until one exists its account is invisible to us, and so is every event Lighter reports about it. A caller that deposited through this service is already bound by that deposit, and calls this only to have the account index recorded once there is one.
        The address is never taken from the caller. It is recovered from the signature, and afterwards read back from what that recovered, so deadline and signature are read only while the wallet has proved nothing. Send them anyway: whether they are needed depends on what this service has recorded, which the caller cannot know, and by the time a refusal came back the vault would be locked again. This is what keeps the passcode prompt to once per wallet.
        The account index is Lighter's to say, and it is asked for on every call. A wallet whose account does not exist yet is bound to its address alone and answered not_registered, which is not a failure but where every wallet starts: poll GET /account and continue as soon as account_index is set. It is filled in by whichever write learns it first, this one included.
        Not knowing is not the same as not having, so when Lighter cannot say what the address owns the request is refused with 503 and nothing is recorded -- a not_registered on a timeout would report a state this service never established. The reads answer the same way. Retrying inside the signature's deadline needs no new signature, so the refusal costs no second prompt.
        A 503 says nothing was learned, never that something was undone. The binding is written before the account is read, so a refusal can arrive with the row already recorded -- and the answer is to call again rather than to report a failed registration. The repeat is free: the address is read back from the row, so no signature is needed for it, and re-binding what is recorded writes nothing.
        The answer names l1_address either way, and that is worth reading: the address was recovered from a signature rather than sent, so a wallet bound to one it did not expect would otherwise find out only when a later proof, signed over the address it believes in, is refused.
        A binding never moves, and there is nothing here with which to redirect it: a bound wallet is served the address it recorded whatever it signs now, so re-binding is accepted and changes nothing, which is the ordinary case.
        A 409 therefore reports a collision with another wallet rather than a caller changing its mind: l1_address_taken when that address is already held elsewhere, lighter_account_taken when the account behind it is. The usual cause is one wallet re-imported under a new wallet_id, while the old id still holds the row; somebody has to remove it, which is not something this endpoint can do. wallet_already_bound is the third and is all but unreachable -- it needs two first binds for one wallet to race each other, or Lighter to name a different account for an address it has already placed.
        A proof made over some other address is not a conflict but a refused proof, 401: it was signed for a statement this service is not making. Read l1_address in the answer above, or from GET /account, to see which address that is.
      parameters:
        - $ref: '#/components/parameters/WalletIDHeader'
        - $ref: '#/components/parameters/WalletAuthHeader'
      security:
        - KeeperAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BindAccountRequest'
      responses:
        "200":
          description: The binding as it now stands, with the account when there is one.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Account'
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "409":
          $ref: '#/components/responses/Conflict'
        "500":
          $ref: '#/components/responses/InternalError'
        "503":
          $ref: '#/components/responses/ServiceUnavailable'
  /transactions:
    post:
      tags:
        - transactions
      operationId: reportTransactions
      summary: Report transactions the caller submitted to Lighter
      description: |-
        Records transactions the caller has already submitted to Lighter so they can be forwarded to the Argus event stream. This service neither signs nor sends them: the client signs locally, submits to Lighter directly, and reports the result here.
        Only transactions Lighter accepted belong in the body — one that never reached the venue did not happen and must not be reported.
        Report everything the action took, in submission order. Types the event stream does not consume yet are accepted and ignored, so the caller never has to filter: today only ORDER_CREATE is forwarded, and a leverage change reported alongside it is simply dropped.
        A 202 means recorded, not delivered: forwarding is asynchronous.
        Repeating a report is safe but not free. A repeat that arrives before the event has been forwarded is dropped; one that arrives after produces a second event carrying the same event_id. Delivery is therefore at-least-once and consumers must deduplicate on event_id, which is the transaction hash.
      parameters:
        - $ref: '#/components/parameters/WalletIDHeader'
        - $ref: '#/components/parameters/WalletAuthHeader'
      # The account is not named here any more: it is the one the wallet's proved address owns. The
      # Lighter token is gone with it -- holding a credential for an account proved nothing that the
      # address does not prove better.
      security:
        - KeeperAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReportTransactionsRequest'
      responses:
        "202":
          description: Recorded for forwarding.
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "500":
          $ref: '#/components/responses/InternalError'
        "503":
          $ref: '#/components/responses/ServiceUnavailable'
  /transactions/send:
    post:
      tags:
        - transactions
      operationId: sendTransactions
      summary: Relay signed transactions to Lighter
      description: |-
        Submits transactions the client has already signed. This service does not sign: the trading key never leaves the device, and the signature inside each payload is the whole authorization Lighter checks. What is added here is that the payload has to name the account the caller's proved address owns, and that an accepted order is reported to the event stream without the client having to report it.
        One request, one submission, in order. One transaction goes to Lighter's single endpoint and several to its batch one, which does not accept every type — a leverage or margin change has to be the only entry in the request, and Lighter says so itself if it is not.
        What may be sent is Lighter's to decide, not this service's: nothing is filtered by type here. A refusal comes back as details.reason in this API's own vocabulary, never as the venue's code.
        Accepted means accepted by Lighter, not executed. An order can still be cancelled at matching, by slippage or by its own time in force, and that outcome arrives over the event stream.
        Not idempotent. A repeat carries the same nonce and is refused by Lighter, so a retry has to be signed again against a fresh nonce.
      parameters:
        - $ref: '#/components/parameters/WalletIDHeader'
        - $ref: '#/components/parameters/WalletAuthHeader'
      security:
        - KeeperAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SendTransactionsRequest'
      responses:
        "200":
          description: Lighter accepted the batch.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SendTransactionsResponse'
        "400":
          description: |-
            The request was refused, by this service or by Lighter, and details.reason says what to do about it: resign_required — read the nonce again and sign a fresh transaction; order_gone — the order is no longer active, read the state instead of repeating; batch_not_accepted — split the request; invalid_transaction — the signed payload is wrong and repeating it will not help; lighter_rejected — the venue refused it for a reason this service cannot yet name. Plus the request-shaped ones: empty_batch, malformed_tx_info, foreign_account, integrator_fee_mismatch.
            integrator_fee_mismatch means a transaction that can produce a fill (14 CreateOrder, 17 ModifyOrder, 28 CreateGroupedOrders) does not carry exactly the partner attribution this service serves: read GET /integrator and sign in all three values as given. Any other rate is refused, below the served one as well as above it.
            A refused submission never reached a block; a retry has to be signed again against a fresh nonce.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "409":
          $ref: '#/components/responses/Conflict'
        "500":
          $ref: '#/components/responses/InternalError'
        "503":
          description: |-
            Either Lighter did not answer, or it declined to serve the request at all — a 5xx, a timeout, a rate limit, or anything else that judges nothing about the payload. The transaction may or may not have landed; read the account before signing the same nonce again.
            Also answered when relaying is switched off because this service has nowhere to report an accepted order to. Nothing was sent in that case.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /transactions/next-nonce:
    get:
      tags:
        - transactions
      operationId: getNextNonce
      summary: The nonce the caller's next Lighter transaction must carry
      description: |-
        Lighter counts transactions per API key slot, and a signed transaction names the nonce it was signed for. Reading one consumes nothing: the same slot answers the same number until a transaction of its own is accepted.
        The account comes back with it because the signed payload has to name that too, so signing needs no second call.
        Slots are independent counters. Signing in parallel takes one slot per stream — two transactions signed for the same nonce cannot both be accepted.
      parameters:
        - name: api_key_index
          in: query
          required: true
          description: The API key slot the transaction will be signed with. 255 is Lighter's "all keys" sentinel, which no transaction can be signed with, and is refused here rather than upstream.
          schema:
            type: integer
            minimum: 0
            maximum: 254
            example: 3
        - $ref: '#/components/parameters/WalletIDHeader'
        - $ref: '#/components/parameters/WalletAuthHeader'
      security:
        - KeeperAuth: []
      responses:
        "200":
          description: The next nonce for this account and slot.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NextNonce'
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "409":
          $ref: '#/components/responses/Conflict'
        "500":
          $ref: '#/components/responses/InternalError'
        "503":
          $ref: '#/components/responses/ServiceUnavailable'
  /integrator:
    get:
      tags:
        - integrator
      operationId: getIntegrator
      summary: Partner-attribution values the caller signs into its Lighter transactions
      description: |-
        What the client copies, unchanged, into the transactions it signs. Two of them consume these values: an order takes integrator_account_index and the two fees, while ApproveIntegrator -- signed once, before the first order that carries a fee -- takes the account index and the four maximums, with an expiry of now plus approval_ttl_ms.
        Fees are millionths of a fill's notional, Lighter's own unit, so 900 is 9 basis points. A zero account index means attribution is off and the client signs no integrator fields at all; that is also the answer while this service has no integrator account configured.
        Answered per wallet, and meant to be read before signing rather than kept for the session: the rate is this service's to set and may one day differ between callers.
        Spot maximums are always zero. This service trades perpetuals, and approving a spot maximum would grant a permission nothing here uses.
      parameters:
        - $ref: '#/components/parameters/WalletIDHeader'
        - $ref: '#/components/parameters/WalletAuthHeader'
      security:
        - KeeperAuth: []
      responses:
        "200":
          description: The attribution to sign.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Integrator'
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "500":
          $ref: '#/components/responses/InternalError'
        "503":
          $ref: '#/components/responses/ServiceUnavailable'
  /account/ro-token:
    post:
      tags:
        - account
      operationId: saveRoToken
      summary: Store the caller's Lighter read-only token (deprecated)
      deprecated: true
      description: |-
        Deprecated. Use POST /account/ro-token/issue, which mints the token here instead of taking one the client minted. Kept until clients have moved; it is not otherwise being changed.
        Two things are worse on this path, and neither can be fixed while the token arrives ready-made. A token minted at Lighter and not submitted here is a live read-only credential nobody knows about, and the two calls it takes can always come apart. And Lighter names a token by an id this endpoint never sees, so nothing stored through it can ever be revoked -- superseding it marks it unused here while it stays alive at the venue.
        Persists the caller's Lighter read-only token, encrypted at rest via Vault Transit, and binds the wallet to the Lighter account that token belongs to. The token value travels in the X-Lighter-Auth header; the body carries a signature proving the caller holds the L1 key the account is registered under.
        The token is also tried against Lighter before it is stored: one it does not honour for that account is refused here rather than kept and discovered later, when only the background reconciliation would notice.
        The account index is not taken from the caller. It is read out of the token and accepted only when it is the account this wallet's L1 address owns, which Lighter is the one to say. That address comes from what the wallet proved earlier -- its first deposit, usually -- so a signature is needed here only when it has proved nothing yet. Once bound, a wallet keeps its address and account: a proof naming another, or one another wallet holds, answers 409.
      parameters:
        - $ref: '#/components/parameters/WalletIDHeader'
        - $ref: '#/components/parameters/WalletAuthHeader'
      # Both are required here: the device token says who is calling, and the Lighter token is what
      # gets stored. Unlike the read endpoints, neither is optional.
      security:
        - KeeperAuth: []
          LighterAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SaveRoTokenRequest'
      responses:
        "204":
          description: Token stored (encrypted at rest).
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "409":
          $ref: '#/components/responses/Conflict'
        "500":
          $ref: '#/components/responses/InternalError'
        "503":
          $ref: '#/components/responses/ServiceUnavailable'
  /account/ro-token/issue:
    post:
      tags:
        - account
      operationId: issueRoToken
      summary: Mint the caller's Lighter read-only token and store it
      description: |-
        Mints a read-only token at Lighter for the caller's account, stores it encrypted at rest via Vault Transit, and returns it. It replaces the two steps a client used to take -- minting at Lighter itself, then registering the result here -- with one, so a token cannot be minted and then never registered.
        What the caller supplies is lighter_auth: the short-lived credential its Lighter L2 key produced locally. It is a bearer credential and not a signature over this request, so it authorises anything Lighter accepts it for until it expires, and it is passed straight through without being stored or logged. The L2 private key itself never travels.
        The account is not named by the caller. It is the one the wallet's proved L1 address owns, which is also what the token is minted against, so a wallet with no Lighter account yet -- one whose first deposit has not been credited -- has nothing to mint for and is answered 409.
        The token's expiry and its reach are this service's to set, not the caller's, and are therefore absent from the body: it is minted long-lived, because the private reads this service makes on the caller's behalf run on it and nothing renews it, and scoped to the main account, because a wallet maps to exactly one.
        Minting supersedes whatever token the account had. Superseded tokens are revoked at Lighter on a best-effort basis, in this request and only here: revoking takes the same short-lived authorization the mint did, so once this request ends nothing can revoke them any more.
      parameters:
        - $ref: '#/components/parameters/WalletIDHeader'
        - $ref: '#/components/parameters/WalletAuthHeader'
      security:
        - KeeperAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IssueRoTokenRequest'
      responses:
        "200":
          description: Token minted and stored (encrypted at rest).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IssuedRoToken'
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "409":
          $ref: '#/components/responses/Conflict'
        "500":
          $ref: '#/components/responses/InternalError'
        "503":
          $ref: '#/components/responses/ServiceUnavailable'
  /positions:
    get:
      tags:
        - positions
      operationId: listOpenPositions
      summary: The caller's open positions
      description: |-
        Every position the wallet currently holds, one per venue and market, with the numbers a position card renders. Only open ones: Lighter keeps a row for every market an account has ever traded, and on a long-lived account the closed rows outnumber the open ones many times over, so a zero size is filtered here rather than on the client.
        Built from public reads -- the account snapshot Lighter serves by index, and the cached markets snapshot for mark prices -- so no read-only token is involved. Take-profit and stop-loss legs are not here: they are open orders, which do need one.
        Neither paginated nor filtered on purpose. One position per market caps the list at the number of active markets, and the upstream snapshot is unpaginated anyway, so a cursor would add failure modes without bounding anything.
        A wallet with no account yet, and an account with nothing open, both get an empty list rather than an error: that is what a client renders before the first position.
      security:
        - KeeperAuth: []
      parameters:
        - $ref: '#/components/parameters/WalletIDHeader'
        - $ref: '#/components/parameters/WalletAuthHeader'
      responses:
        "200":
          description: The caller's open positions.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OpenPositionsPage'
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "500":
          $ref: '#/components/responses/InternalError'
        "503":
          $ref: '#/components/responses/ServiceUnavailable'
  /positions/{id}:
    get:
      tags:
        - positions
      operationId: getOpenPosition
      summary: One open position with its auto-close legs
      description: |-
        The same position the list carries, plus the take-profit and stop-loss legs attached to it. The legs are open orders on the market, so reading them needs the wallet's Lighter read-only token; this service uses the one the wallet stored through /account/ro-token rather than asking the caller for it again.
        auto_close_known says whether the legs were read at all. Without it a null auto_close would mean both "there are none" and "we could not look", and a client would offer to create a take-profit over one that already exists. It is false when the wallet has stored no token, when the stored one has expired, and when the token could not be decrypted.
        The id comes from the list and is opaque. A market the wallet holds nothing open in is a 404, including one whose position has just closed -- Lighter keeps a zero-size row for it, and a zero-size row is not a position.
      security:
        - KeeperAuth: []
      parameters:
        - $ref: '#/components/parameters/WalletIDHeader'
        - $ref: '#/components/parameters/WalletAuthHeader'
        - name: id
          in: path
          required: true
          description: Position id as the list reported it, e.g. `lighter:1`.
          schema:
            type: string
          example: lighter:1
      responses:
        "200":
          description: The position and its auto-close legs.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OpenPositionDetail'
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "404":
          $ref: '#/components/responses/NotFound'
        "500":
          $ref: '#/components/responses/InternalError'
        "503":
          $ref: '#/components/responses/ServiceUnavailable'
  /positions/{id}/state:
    get:
      tags:
        - positions
      operationId: getPositionState
      summary: What became of a market's position, and of the order just sent
      description: |-
        Answers the question a client has right after submitting an order: did anything happen. It reads this service's own record and nothing else, so it is cheap to poll -- no Lighter call, no read-only token, no markets snapshot.
        Two things are answered. `open` is the position the market holds now, and `last_closed` is the one that ended most recently; a client that closed a position needs the second, because an absent position alone cannot tell "it closed" from "there never was one". Both are episodes: one life of a position, from the fill that opened it to the fill that closed it. Lighter keeps only the current size, so a closed position leaves no trace there at all -- `/positions/{id}` answers 404 for a market whose position closed a minute ago.
        `orders` is what the venue said about the orders carrying `client_order_index`, and it is empty until an order event arrives. An empty list therefore means "nothing heard yet", which is the state to keep polling on; a client knows it submitted, so this service does not repeat that back. Several entries are a legitimate answer: nothing makes that number unique, and a client that reused it is told about every order rather than being handed a guess. Without the parameter the list is empty and only the position halves are answered.
        A market this wallet has never traded is `open: null`, `last_closed: null`, `orders: []` -- not a 404. The question "what is the state" always has an answer, and "nothing" is one.
      security:
        - KeeperAuth: []
      parameters:
        - $ref: '#/components/parameters/WalletIDHeader'
        - $ref: '#/components/parameters/WalletAuthHeader'
        - name: id
          in: path
          required: true
          description: Position id as the list reports it, e.g. `lighter:1`. Only the market it names is read here; the episode is addressed by its own id inside the response.
          schema:
            type: string
          example: lighter:1
        - name: client_order_index
          in: query
          required: false
          description: 'The number the caller chose for its order when it signed it. Optional, and the only way to be told what became of one particular order: it is inside the signed payload, so this service reads it and never assigns one. Zero is refused rather than looked up -- it is what an order carries when nobody chose a number, so it addresses nothing.'
          schema:
            type: integer
            format: int64
          example: 1756280400123
      responses:
        "200":
          description: The market's position state, and the orders the number names.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PositionState'
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "500":
          $ref: '#/components/responses/InternalError'
        "503":
          $ref: '#/components/responses/ServiceUnavailable'
  /portfolio:
    get:
      tags:
        - portfolio
      operationId: getPortfolio
      summary: Balance, open positions and open orders
      description: |-
        Everything the portfolio section renders in one read: the account balance, every open position with the numbers a position card needs, and the orders resting on the book. Replaces /screens/portfolio, which carries a thinner position and no orders at all.
        Balance and positions come from the account snapshot Lighter serves by index, and mark prices from the cached markets snapshot; neither needs a token. open_orders does, and this service uses the read-only token it stored for the wallet rather than asking the caller.
        open_orders_known says whether the orders were read at all. False means the section could not be filled -- no stored token, an expired one, one Vault would not decrypt, or an upstream that did not answer -- and open_orders is then empty because nothing was seen, not because nothing is resting. Render "temporarily unavailable" on false, never "no open orders". Orders never turn this endpoint into a 503: the balance and the positions are an answer of their own.
        Take-profit and stop-loss legs are not here. They belong to a position and are served with it by /positions/{id}.
        A wallet with no account yet gets empty sections rather than an error.
      security:
        - KeeperAuth: []
      parameters:
        - $ref: '#/components/parameters/WalletIDHeader'
        - $ref: '#/components/parameters/WalletAuthHeader'
      responses:
        "200":
          description: The caller's balance, positions and open orders.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Portfolio'
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "500":
          $ref: '#/components/responses/InternalError'
        "503":
          $ref: '#/components/responses/ServiceUnavailable'
  /orders:
    get:
      tags:
        - orders
      operationId: listOpenOrders
      summary: The caller's open orders
      description: |-
        Every order resting on the book across all markets. An unfilled order is not a position -- it holds no entry price, no PnL and no liquidation price -- so it appears here and never in /positions.
        Take-profit and stop-loss legs are filtered out: they are attached to a position and are served with it by /positions/{id}, and listing them here would show the same leg twice.
        Reading orders needs the wallet's stored read-only token, so unlike /positions this endpoint depends on Vault. orders_known carries that: false means the list could not be read and is empty for that reason alone. It is a 200, not a 503 -- a wallet without an active token is a state that no retry changes, and the client renders its unavailable block from the flag. A genuine upstream failure is still a 503.
        Neither paginated nor filtered: an account's resting orders are bounded by what it can afford to place.
      security:
        - KeeperAuth: []
      parameters:
        - $ref: '#/components/parameters/WalletIDHeader'
        - $ref: '#/components/parameters/WalletAuthHeader'
      responses:
        "200":
          description: The caller's open orders.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OpenOrdersPage'
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "500":
          $ref: '#/components/responses/InternalError'
        "503":
          $ref: '#/components/responses/ServiceUnavailable'
  /orders/{id}:
    get:
      tags:
        - orders
      operationId: getOrder
      summary: One order, resting or finished, with its fills
      description: |-
        The order the id names, wherever it is now. Resting orders are read from the book; one that has left it -- filled, cancelled or expired -- is looked up in the account's order history, which is walked page by page because the venue offers no lookup by order id. `resting` says which of the two answered.
        The history walk is bounded. An order older than the walk reaches is a 404, which is therefore "not found within the window this endpoint looks at" rather than a claim that it never existed.
        `fills` is the execution broken down into trades, which the order itself does not carry -- it holds only the filled totals. That lookup is walked and bounded like the one above, so fills_known is false both when it failed and when the cap cut it short with pages still to come. Only under a true flag does an empty list mean the order has not traded.
      security:
        - KeeperAuth: []
      parameters:
        - $ref: '#/components/parameters/WalletIDHeader'
        - $ref: '#/components/parameters/WalletAuthHeader'
        - name: id
          in: path
          required: true
          description: Order id as the list reports it, e.g. `lighter:281474976712112`.
          schema:
            type: string
          example: lighter:281474976712112
      responses:
        "200":
          description: The order, and the trades it produced.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderDetail'
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "404":
          $ref: '#/components/responses/NotFound'
        "409":
          $ref: '#/components/responses/Conflict'
        "500":
          $ref: '#/components/responses/InternalError'
        "503":
          $ref: '#/components/responses/ServiceUnavailable'
  /screens/markets:
    get:
      tags:
        - screens
      operationId: getMarketsScreen
      summary: Markets list screen
      description: Aggregates the markets-list screen in a single call by merging Lighter orderBookDetails, assetDetails, and funding-rates into screen-shaped market rows. Supports free-text search, a coarse filter, and sorting so the client renders the list without further requests.
      parameters:
        - name: q
          in: query
          required: false
          description: Free-text search over market symbol/name.
          schema:
            type: string
            example: BTC
        - name: filter
          in: query
          required: false
          description: 'Coarse market bucket to display. View buckets (trending/all/favorites) and asset-category buckets (tokens/perps/commodities/stocks/etfs/fx) share this single axis; exactly one is selected at a time. Category is derived server-side from Lighter asset metadata, keyed by market symbol. Four caveats: `fx` is not yet a signed-off tab (it exists so the currency-pair markets are reachable — ignore it until product decides); `perps` currently selects nothing, since every Lighter market is a perpetual, so it returns the same rows as `all`; `favorites` has no writer, because this API has no endpoint for marking a market a favourite, so where that set comes from is still open; and a handful of markets fit no category bucket, so they are returned only by the view buckets and by free-text search.'
          schema:
            type: string
            enum:
              - trending
              - all
              - favorites
              - tokens
              - perps
              - commodities
              - stocks
              - etfs
              - fx
            default: all
        - name: sort
          in: query
          required: false
          description: Sort key for the returned rows (e.g. volume, price change, funding). Opaque to the server contract; unknown values fall back to default.
          schema:
            type: string
            example: volume_desc
      responses:
        "200":
          description: Markets screen payload.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MarketsScreen'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "500":
          $ref: '#/components/responses/InternalError'
        "503":
          $ref: '#/components/responses/ServiceUnavailable'
  /screens/trading:
    get:
      tags:
        - screens
      operationId: getTradingScreen
      summary: Trading screen bootstrap
      description: |-
        Single-call bootstrap for the trading screen: contract metadata for the market, the caller's current position, open orders, balance, and the action flags that drive UI affordances. Live orderbook and candles are delivered out-of-band over the Hermes WebSocket and are NOT part of this payload.
        The market data is public; the private sections are the wallet's, and the caller carries no credential for them: the read-only token comes from this service's own store.
        The two absences differ. A wallet whose address owns no Lighter account yet, or one Lighter would not name an account for, gets the market and empty private sections throughout. A wallet with an account but no usable stored token keeps its position and balance, which come from the account snapshot and need no token, and loses only open_orders and what is derived from it -- position.auto_close and flags.cancel_enabled. Neither is an error.
      security:
        - KeeperAuth: []
      parameters:
        - name: market
          in: query
          required: true
          description: Lighter market index of the contract to load.
          schema:
            type: integer
            example: 1
        - $ref: '#/components/parameters/WalletIDHeader'
        - $ref: '#/components/parameters/WalletAuthHeader'
      responses:
        "200":
          description: Trading screen payload.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TradingScreen'
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "404":
          $ref: '#/components/responses/NotFound'
        "500":
          $ref: '#/components/responses/InternalError'
        "503":
          $ref: '#/components/responses/ServiceUnavailable'
  /screens/portfolio:
    get:
      tags:
        - screens
      operationId: getPortfolioScreen
      summary: Portfolio screen (deprecated)
      deprecated: true
      description: |-
        Superseded by /portfolio, which carries the same balance, a fuller position -- with id, mark price, margin, equity and ROI -- and the open orders this one has no room for. Frozen: it keeps answering exactly as it does today and gains nothing further.
        Returns equity, available, and transferable balances together with all open positions derived from a single account snapshot, so the portfolio screen renders in one call.
      parameters:
        - $ref: '#/components/parameters/WalletIDHeader'
        - $ref: '#/components/parameters/WalletAuthHeader'
      responses:
        "200":
          description: Portfolio screen payload.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PortfolioScreen'
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "500":
          $ref: '#/components/responses/InternalError'
        "503":
          $ref: '#/components/responses/ServiceUnavailable'
  /orderbook/truncated:
    get:
      tags:
        - orderbook
      operationId: getTruncatedOrderBook
      summary: Order book truncated to a notional
      description: |-
        The near side of one market's book, cut off at the level where the accumulated cost covers the notional asked about, the fee included. The book is biblios' -- this endpoint forwards to it and reshapes nothing, so every number is the string that service printed.
        Which side comes back follows side: a buy consumes asks, a sell consumes bids, and the other array is absent rather than empty. truncated is false when the whole book did not cover the notional, which is the answer that says the depth is not there.
        The data is public, and the wallet headers are still required: the same pair as every other read, so a client that calls one calls this.
      security:
        - KeeperAuth: []
      parameters:
        - name: market
          in: query
          required: true
          description: Lighter market index of the contract to load.
          schema:
            type: integer
            format: int32
            example: 1
        - name: side
          in: query
          required: true
          description: The side the caller would trade. buy reads asks, sell reads bids.
          schema:
            type: string
            enum:
              - buy
              - sell
        - name: fee_rate
          in: query
          required: true
          description: 'The taker fee as a fraction, in [0;1) -- "0.0005" is five basis points. Plain decimal only: exponent notation is refused, and at most eight decimal places.'
          schema:
            type: string
            pattern: ^0(\.[0-9]{1,8})?$
            example: "0.0005"
        - name: notional
          in: query
          required: true
          description: The quote amount the truncation has to cover, fee included. A plain decimal with at most eight decimal places, and greater than zero, so "0" and "0.00" are refused while "0.50" is fine.
          schema:
            type: string
            pattern: ^(?!0+(\.0+)?$)(0|[1-9][0-9]{0,17})(\.[0-9]{1,8})?$
            example: "2500"
        - $ref: '#/components/parameters/WalletIDHeader'
        - $ref: '#/components/parameters/WalletAuthHeader'
      responses:
        "200":
          description: The truncated book.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TruncatedOrderBook'
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "500":
          $ref: '#/components/responses/InternalError'
        "503":
          $ref: '#/components/responses/ServiceUnavailable'
  /activity:
    get:
      tags:
        - activity
      operationId: getActivity
      summary: Account activity timeline
      description: |-
        Merged, cursor-paginated timeline of fills, funding payments, deposits, and withdrawals. Uses an opaque keyset cursor and returns last_sort_ts so the client can detect ranking shifts between polls. Deposits appear from the moment they are registered, as items of type deposit with status pending; the one Lighter reports once the money lands is the same item under the same id, with a new status, so the client updates a row rather than replacing it. A deposit that is never confirmed leaves the feed when it is closed, and its outcome is then only on /funding/deposit/{deposit_id}.
        The feed belongs to the wallet, and the caller carries no credential for it -- everything Lighter holds is read with the token this service keeps. Without a usable one -- or for a wallet whose address owns no Lighter account yet, or one Lighter will not name an account for right now -- the page carries only this service's own record of the wallet's deposits, which is what a first deposit has instead of an account. A wallet that has proved no address gets an empty page rather than an error, and so does an outage this service can still read its own rows through.
      security:
        - KeeperAuth: []
      parameters:
        - name: type
          in: query
          required: false
          description: Filter the timeline to a single activity type.
          schema:
            type: string
            enum:
              - fill
              - funding
              - deposit
              - withdrawal
              - liquidation
              - tp_executed
              - sl_executed
            example: fill
        - name: market
          in: query
          required: false
          description: Restrict the timeline to a single Lighter market index.
          schema:
            type: integer
            example: 1
        - $ref: '#/components/parameters/CursorQuery'
        - $ref: '#/components/parameters/LimitQuery'
        - $ref: '#/components/parameters/WalletIDHeader'
        - $ref: '#/components/parameters/WalletAuthHeader'
      responses:
        "200":
          description: Cursor-paginated activity page.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ActivityPage'
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "500":
          $ref: '#/components/responses/InternalError'
        "503":
          $ref: '#/components/responses/ServiceUnavailable'
  /funding/deposit:
    post:
      tags:
        - funding
      operationId: openDeposit
      summary: Record a deposit
      description: |-
        Records that this address has deposited, so its progress can be followed and it can appear in history while it is still on its way. Nothing is registered with Lighter here: the deposit call on Ethereum already names its recipient, and Lighter keeps only what arrived, not what was intended.
        Call it after sending, not before. There is no address to be told and no expectation to register, so nothing about the deposit depends on this call — a deposit never recorded is still credited, it just cannot be shown as pending or pushed about.
        Several deposits can be recorded at once, and funds arrive whether or not a record is waiting for them. What decides whether a call creates a record or returns an existing one is operation_id: the same one returns the same deposit, a new one creates another.
        The address is never taken from the caller. On a wallet's first write it is recovered from the signature in the body, and from then on it is read from what that proof established — so a deposit cannot be recorded against somebody else's address. There is still no account index here: the first deposit is what creates the account, and the index is filled in once the money lands.
        Send deadline and signature on every call. Whether they are required depends on what this service has recorded, which the client cannot know, and by the time a refusal came back the vault would be locked again — so sign in the same unlock as the deposit transaction and let the pair travel every time. They are read only while the wallet has proved no address yet, and ignored after that. This is what keeps the passcode prompt to once per wallet.
        Call it once the Ethereum transaction is known: that hash is what the deposit is confirmed by, so a deposit paid from another chain is recorded after the aggregator delivers, not when the caller signs.
      security:
        - KeeperAuth: []
      parameters:
        - $ref: '#/components/parameters/WalletIDHeader'
        - $ref: '#/components/parameters/WalletAuthHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OpenDepositRequest'
      responses:
        "200":
          description: The deposit recorded, or the one this operation_id already named.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Deposit'
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "409":
          $ref: '#/components/responses/Conflict'
        "500":
          $ref: '#/components/responses/InternalError'
        "503":
          $ref: '#/components/responses/ServiceUnavailable'
  /funding/deposit/{deposit_id}:
    get:
      tags:
        - funding
      operationId: getDeposit
      summary: Read a recorded deposit
      description: |-
        Returns what is known about a deposit: whether it has been credited, for how much when it has, and the Lighter account it created once there is one.
        This is the gate of the registration flow, and the only reader of it in this API. A first deposit is what creates the account, so a client records the deposit, polls this, and continues as soon as account_index is set. There is no deposit-details screen.
        The moment itself is Lighter's to report, and this endpoint asks it: a record with no account_index is answered by resolving the address against Lighter live, rather than from what the next scheduled check will write. A client with its own Lighter integration can therefore learn the same thing without this call, one hop earlier. What is only here is the deposit while it is still on its way: the pending row, the amount that was declared -- Lighter keeps only what arrived, so "expected N, got M" can be answered from nowhere else -- and the unfunded verdict.
        Answered to the wallet the deposit belongs to. The deposit_id was the whole authorisation once, and is not any more: an id leaks — into a log, a crash report, an analytics event — and it can also be asked for, since recording the same transaction again returns the deposit that already exists, id included. A deposit of another wallet answers 404 rather than 403, because telling those apart would confirm that the id exists.
        Everything in this response stays public by construction all the same — the amounts are in the Ethereum transaction and the account index follows from the address — and it must stay that way. Anything private added here would be published to whoever watches the chain.
        account_index is answered live for as long as the record has none, since that is the field a client is waiting on. The credit is not: it comes from this service's own record, written by the deposit's next scheduled check, so polling faster than that schedule learns nothing about the amount. Once it reports credited or unfunded the answer no longer changes, so there is nothing to gain by asking again.
      security:
        - KeeperAuth: []
      parameters:
        - $ref: '#/components/parameters/WalletIDHeader'
        - $ref: '#/components/parameters/WalletAuthHeader'
        - name: deposit_id
          in: path
          required: true
          description: The id returned when the deposit was recorded.
          schema:
            type: string
            example: 0f9c2b1e-4a7d-4f61-9c3a-1b2d3e4f5a6b
      responses:
        "200":
          description: The deposit as recorded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Deposit'
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "404":
          $ref: '#/components/responses/NotFound'
        "500":
          $ref: '#/components/responses/InternalError'
        "503":
          $ref: '#/components/responses/ServiceUnavailable'
  /funding/quote:
    post:
      tags:
        - funding
      operationId: quoteDeposit
      summary: Quote a deposit from another asset
      description: |-
        Prices a top-up of the caller's Lighter account paid with an asset on another chain, and returns what the client has to sign to make it happen. Nothing moves here: the quote is an offer, and the payloads are the client's to sign and broadcast from its own wallet.
        The money always lands as USDC on Ethereum, because that is where Lighter's gateway is, and the deposit into the gateway is part of the same cross-chain action: the aggregator delivers the USDC and calls the gateway with it, naming destination_address as the account to credit. The client therefore signs only on the source chain.
        The pricing is swaps-backend's (`POST /v2/crosschain/quotes` with `destination_target: lighter`): it asks the aggregator, sizes the deposit into the budget and checks the payloads against the quote. This service checks what only it knows -- whose account the deposit credits -- and hands the rest on.
        source_amount is a budget, not a price: the payloads returned never ask for more than it, and the deposit is sized to what that amount buys after the aggregator's fees, which is why expected_amount and min_amount are equal -- the deposit is exact, and the slippage the quote allowed for was on the source side. The whole of source_amount is rarely spent to the last unit.
        A source asset that is already USDC on Ethereum needs no aggregator: the payloads are then the approval and the gateway call for the client's own Ethereum key, provider is `direct`, and there is nothing to track.
        The quote is good for the seconds expires_at says. The aggregator revalidates at fill time, so a stale one is refunded rather than filled at a worse price -- ask again instead of signing an old one.
        The wallet's L1 address is destination_address, and the two must agree once the wallet has proved one: a quote for somebody else's account is refused. A wallet that has proved nothing yet -- the first deposit is what creates the account -- is quoted for the address it names, and proves it when it records the deposit.
        What this does not do yet: it does not initialise the Lighter account's signing key. A first deposit creates the account, and registering a key on it is a separate step the client takes once the account exists.
      security:
        - KeeperAuth: []
      parameters:
        - $ref: '#/components/parameters/WalletIDHeader'
        - $ref: '#/components/parameters/WalletAuthHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DepositQuoteRequest'
      responses:
        "200":
          description: The quote and the payloads to sign.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DepositQuote'
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "409":
          $ref: '#/components/responses/Conflict'
        "500":
          $ref: '#/components/responses/InternalError'
        "503":
          $ref: '#/components/responses/ServiceUnavailable'
  /funding/status/{execution_id}:
    get:
      tags:
        - funding
      operationId: getFundingStatus
      summary: Follow a quoted deposit through the aggregator
      description: |-
        Reports where a cross-chain deposit is, by the execution_id its quote returned: whether the aggregator has seen the source transaction, filled on Ethereum, failed, or refunded. The execution lives at swaps-backend, which follows the fill by the id the aggregator quoted it under, so nothing has to be submitted there first: the wallet broadcasts on its own and polls.
        This is how a client that paid from another chain learns the Ethereum transaction hash: the aggregator's fill is the transaction that called the gateway, so once status is success the first entry of tx_hashes is what POST /funding/deposit takes as l1_tx_hash. Until then there is nothing to record.
        Poll while status is pending. success, failure and refund are final. unknown means the aggregator has no such execution, which is also what an expired, never-broadcast quote looks like.
      security:
        - KeeperAuth: []
      parameters:
        - $ref: '#/components/parameters/WalletIDHeader'
        - $ref: '#/components/parameters/WalletAuthHeader'
        - name: execution_id
          in: path
          required: true
          description: The tracking.execution_id a quote returned.
          schema:
            type: string
            maxLength: 128
            example: a3f1c2d4-5b6e-4f70-8a9b-0c1d2e3f4a5b
      responses:
        "200":
          description: Where the deposit is.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FundingStatus'
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "500":
          $ref: '#/components/responses/InternalError'
        "503":
          $ref: '#/components/responses/ServiceUnavailable'
components:
  securitySchemes:
    KeeperAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |-
        Device access token minted by keeper-auth. Names the device, not the wallet: which of the device's wallets a request concerns comes from X-Wallet-Id, paired with it by X-Wallet-Authorization, which is signed by that wallet's own key over this very token.
        No endpoint asks multichain-backend today whether the device is still active and its sessions have not been reset. That is the only way to notice a revocation before the token expires, so a revocation stays invisible for the token's remaining life (15 minutes plus skew). The price is deliberate: nothing here fails when multichain-backend does. Consequently 403 and 401 device_inactive / token_revoked are declared across the operations but never produced. Handle them anyway -- an endpoint starting to ask is not a change of contract.
    LighterAuth:
      type: apiKey
      in: header
      name: X-Lighter-Auth
      description: |-
        Lighter read-only token, in its `ro:{account}:{single|all}:{expiry}:{hex}` form. Lighter mints it (createToken or its front-end) and shows it once; its expiry is chosen at creation, between a day and ten years, which is why expires_at travels with it when it is stored here. Not to be confused with Lighter's other credential of the same shape in spirit: the token the SDK signs locally is capped at 8 hours and is not what this header carries.
        Only needed on endpoints that read the caller's private Lighter data (open orders, fills with realized PnL, funding payments, deposit/withdraw history). Without it those private sections are omitted/empty rather than producing a hard error.
        Storing one (POST /account/ro-token) refuses anything without the `ro:` prefix: the other kind expires within hours, and a stored one would work for a while and then take the background reconciliation blind with it.
  parameters:
    CursorQuery:
      name: cursor
      in: query
      required: false
      description: Opaque keyset cursor returned as next_cursor by a previous page.
      schema:
        type: string
        example: eyJvZmZzZXQiOjIwfQ==
    LimitQuery:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        default: 20
        minimum: 1
        maximum: 100
    WalletAuthHeader:
      name: X-Wallet-Authorization
      in: header
      required: true
      description: |-
        Proof that the wallet owns the access token in Authorization: base64url of a 65-byte recoverable secp256k1 signature (R | S | V) over LP("keeper.wallet.auth.v1") | LP(blake2b256(access_token)), padding optional. The same header custodial-battery takes, so a client that signs one signs both.
        It carries no operation of its own. What it answers is "is this wallet the caller's": the id is recomputed from the key recovered out of the signature, so a wallet nobody holds the key to cannot be named at all, and a stolen access token does not help — it is not the wallet's key. On the writes, which do not introspect, this is the whole answer.
        Required. A format 2 wallet_id is what can produce one, and perps is a multichain-wallet product, so the older derivations are out of scope rather than exempt. It is bound to the access token, so it lives exactly as long as that token and is signed again after a device refresh.
        Absent answers 401 wallet_auth_required, whether the header is missing or empty, and that is apart from wallet_auth_invalid: one says you did not sign the session, the other that the signature does not match it.
      schema:
        type: string
        example: 3q2-7wDNrbveEEBoq83vEEBoq83vEEBoq83vEEBoq83vEEBoq83vEEBoq83vEEBoq83vEEBoq83vEEBoq83vAQ
    WalletIDHeader:
      name: X-Wallet-Id
      in: header
      required: true
      description: |-
        Tonkeeper wallet_id the request is about. The access token names the device, and a device carries up to two hundred wallets, so which one a request concerns is something only the client knows.
        Required, and never taken on trust where an endpoint acts on it. On the writes it is checked against X-Wallet-Authorization: the id is recomputed from the key recovered out of that signature and must come out equal, so naming a wallet you hold no key to fails as 401 wallet_auth_invalid. It is inside every operation proof as well, which is what stops one being moved to another wallet. A blank header is 400.
        The reads check it the same way, and take the Lighter account from it rather than from a header: the account a request acts on is the one the wallet's proved address owns, so no caller can read a balance, an address or a position by naming an index. A wallet that has proved no address yet, or whose address owns no Lighter account, is served the public parts and empty private ones.
        Not knowing is not the same as not having: when Lighter cannot say which account an address owns, /account and /screens/portfolio answer 503 rather than report an account state they did not establish. /screens/trading and /activity degrade instead, because each has an answer that does not depend on the account -- the market data for one, this service's own deposit records for the other -- and their private halves already come back empty on an upstream failure.
      schema:
        $ref: '#/components/schemas/WalletID'
  schemas:
    WalletID:
      type: string
      description: |-
        A commitment to the wallet's root key, so the id cannot be claimed without the key it was derived from. Format 2 only: base32 of 36 characters, the derivation that carries its own version and kind and the only one a key can be recovered against.
        Three derivations are in circulation, and the older two (64 hex characters, base32 of 32) are rejected here rather than supported: every endpoint bar the markets screen needs X-Wallet-Authorization, whose check recomputes the id from the key recovered out of the signature, and that cannot be done for an id whose derivation does not allow it. Such an id answers 400 with reason wallet_auth_unsupported_wallet_id, not 401 -- no signature can make it verify, so it is the id that is wrong and not the proof. Perps is a multichain-wallet product, so every caller has a format 2 id.
      minLength: 36
      maxLength: 36
      pattern: ^[a-z2-7]{36}$
      example: aiay32vhbx3wgqvssxk2jvp2ec65fyry2lja
    BindAccountRequest:
      type: object
      description: 'The proof of the address to bind and this wallet''s consent to being bound to it. Nothing else is here: the account is not the caller''s to name, and the address is not the caller''s to claim.'
      required:
        - proof
      properties:
        deadline:
          type: integer
          format: int64
          description: 'Unix seconds past which the signature below is refused, capped by the service at ten minutes ahead. Travels with signature: one without the other is a 400.'
          example: 1755600000
        signature:
          type: string
          pattern: ^0x[0-9a-fA-F]{130}$
          description: |-
            EIP-712 signature over LinkWallet(string walletId,uint64 deadline), under domain {name: TonkeeperPerps, version: "1", chainId: 1} with no verifyingContract. Encoded as 65 bytes of r‖s‖v hex; v may be 27/28 or 0/1, and the high-s form is refused.
            Read only while the wallet has proved no L1 address yet; missing when it is needed answers 400 address_proof_required.
          example: 0x4355c47d63924e8a72e509b65029052eb6c299d53a04e167c5775fd466751c9d07299936d304c153f6443dfa05f40ff007d72911b6f72307f996231605b915621c
        proof:
          type: string
          pattern: ^[0-9a-fA-F]{130}$
          description: |-
            The wallet's consent to this binding, signed with its own root key: hex of a 65-byte recoverable secp256k1 signature (R | S | V) over LP("perps.account.bind.v1") | LP(wallet_id) | LP(l1_address), in the same length-prefixed framing the other writes use. l1_address is lowercase with its 0x and is named here and nowhere in the body.
            The signature above shows that somebody holds the key to an address; this shows that this wallet meant to be bound to it, which is what makes the binding irreversible. Required, and absent answers 401 operation_proof_required.
          example: 4355c47d63924e8a72e509b65029052eb6c299d53a04e167c5775fd466751c9d07299936d304c153f6443dfa05f40ff007d72911b6f72307f996231605b915621c
    IssueRoTokenRequest:
      type: object
      description: 'What it takes to have a read-only token minted: the Lighter authorization to mint it with, a label to remember it by, this wallet''s consent, and the proof of its L1 address when it has none recorded yet. The account, the expiry and the reach are not here -- none of them is the caller''s to choose.'
      required:
        - lighter_auth
        - proof
      properties:
        lighter_auth:
          type: string
          description: The short-lived Lighter authorization the caller's L2 key produced locally, typically good for ten minutes. Carried in the body rather than a header so it is never confused with this API's own authorization, which is a different credential answering a different question. Passed through to Lighter and never stored.
          example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
        name:
          type: string
          description: Optional client-supplied label for the token.
          example: mobile-app
        deadline:
          type: integer
          format: int64
          description: 'Unix seconds past which the signature below is refused, capped by the service at ten minutes ahead. Travels with signature: one without the other is a 400.'
          example: 1755600000
        signature:
          type: string
          pattern: ^0x[0-9a-fA-F]{130}$
          description: |-
            EIP-712 signature over LinkWallet(string walletId,uint64 deadline), under domain {name: TonkeeperPerps, version: "1", chainId: 1} with no verifyingContract. Encoded as 65 bytes of r‖s‖v hex; v may be 27/28 or 0/1, and the high-s form is refused.
            Read only while the wallet has proved no L1 address yet; missing when it is needed answers 400 address_proof_required.
          example: 0x4355c47d63924e8a72e509b65029052eb6c299d53a04e167c5775fd466751c9d07299936d304c153f6443dfa05f40ff007d72911b6f72307f996231605b915621c
        proof:
          type: string
          pattern: ^[0-9a-fA-F]{130}$
          description: |-
            The wallet's consent to this mint, signed with its own root key: hex of a 65-byte recoverable secp256k1 signature (R | S | V) over LP("perps.rotoken.issue.v1") | LP(wallet_id) | LP(l1_address) | LP(auth_hash) | LP(name), in the same length-prefixed framing the other writes use. auth_hash is sha256 of lighter_auth in lowercase hex; name is what this body carries, empty string when omitted; l1_address is lowercase with its 0x and is named here and nowhere in the body.
            The token cannot be signed here the way the store endpoint signs it, because it does not exist yet. The authorization stands in for it and pins the consent to this one mint: the proof cannot be replayed with a different authorization, and the one it names expires within minutes, which bounds the replay window on its own.
            Nothing else in the body is signed, because nothing else in it reaches Lighter. Required, and absent answers 401 operation_proof_required.
          example: 4355c47d63924e8a72e509b65029052eb6c299d53a04e167c5775fd466751c9d07299936d304c153f6443dfa05f40ff007d72911b6f72307f996231605b915621c
    IssuedRoToken:
      type: object
      description: The minted token and what was recorded about it.
      required:
        - token
        - token_id
        - account_index
        - issued_at
        - expires_at
      properties:
        token:
          type: string
          description: 'The read-only token itself, "ro:{account}:{scope}:{expiry}:{secret}". A credential: hold it as one. This service keeps its own encrypted copy, so a client that has no direct use for it can discard it.'
          example: ro:738887:single:1946678400:8f3c1d...
        token_id:
          type: integer
          format: int64
          description: Lighter's id for the token, and the only handle its revocation takes. Keep it if you intend to revoke the token yourself later.
          example: 41207
        name:
          type: string
          description: The label the token was minted and stored under.
          example: mobile-app
        account_index:
          type: integer
          format: int64
          description: The Lighter account the token belongs to, which is the one this wallet's address owns.
          example: 738887
        issued_at:
          type: string
          format: date-time
          description: When this service minted the token.
          example: "2026-09-09T10:00:00Z"
        expires_at:
          type: string
          format: date-time
          description: When the token stops working, as the token itself states it rather than as it was asked for. Far ahead by design; nothing renews it.
          example: "2031-09-08T10:00:00Z"
    SaveRoTokenRequest:
      type: object
      description: 'What travels with a Lighter read-only token: a label to remember it by, this wallet''s consent to storing it, and the proof of its L1 address when it has none recorded yet. The token itself is in the X-Lighter-Auth header, and its account index and expiry are read out of it rather than declared here.'
      required:
        - issued_at
        - proof
      properties:
        name:
          type: string
          description: Optional client-supplied label for the token.
          example: mobile-app
        issued_at:
          type: string
          format: date-time
          description: When the client says the token was issued. Recorded and forwarded to Argus, whose event schema carries the field; nothing here depends on it, because a read-only token states no issue time of its own and this cannot be checked.
          example: "2026-07-22T12:00:00Z"
        deadline:
          type: integer
          format: int64
          description: 'Unix seconds past which the signature below is refused, capped by the service at ten minutes ahead. Travels with signature: one without the other is a 400, because a missing deadline would otherwise be reported as a signature that has expired.'
          example: 1755600000
        signature:
          type: string
          description: |-
            EIP-712 signature over LinkWallet(string walletId,uint64 deadline), under domain {name: TonkeeperPerps, version: "1", chainId: 1} with no verifyingContract. Encoded as 65 bytes of r‖s‖v hex; v may be 27/28 or 0/1, and the high-s form of a signature is refused so one proof has one encoding.
            Read only while the wallet has proved no L1 address yet, which for most callers happened on their first deposit. Send it when you can: the client cannot tell when it is needed, and missing when it is answers 400 address_proof_required.
          pattern: ^0x[0-9a-fA-F]{130}$
          example: 0x4355c47d63924e8a72e509b65029052eb6c299d53a04e167c5775fd466751c9d07299936d304c153f6443dfa05f40ff007d72911b6f72307f996231605b915621c
        proof:
          type: string
          pattern: ^[0-9a-fA-F]{130}$
          description: |-
            The wallet's consent to storing this token, signed with its own root key: hex of a 65-byte recoverable secp256k1 signature (R | S | V) over LP("perps.rotoken.store.v1") | LP(wallet_id) | LP(l1_address) | LP(token_hash) | LP(name) | LP(issued_at), in the same length-prefixed framing custodial-battery uses for its send proof. token_hash is sha256 of the X-Lighter-Auth value in lowercase hex — the token is named by its hash, never signed as itself; name is what this body carries, empty string when omitted; issued_at is unix nanoseconds in decimal, because it is kept and forwarded at that precision; l1_address is lowercase with its 0x.
            Note that l1_address is named here and nowhere in the body. signature only proves that somebody holds the key to an address; this is the wallet saying which address is its own. Both are needed while the wallet has none recorded: without this one an EIP-712 signature captured anywhere could bind the wallet to a stranger's Lighter account.
            Required on every stored token, not only the first, and absent answers 401 operation_proof_required. Requires a format 2 wallet_id, which every multichain wallet has.
          example: 4355c47d63924e8a72e509b65029052eb6c299d53a04e167c5775fd466751c9d07299936d304c153f6443dfa05f40ff007d72911b6f72307f996231605b915621c
    TransactionType:
      type: string
      description: |-
        Business meaning of a submitted transaction. These values belong to the Argus event vocabulary shared with the poc service, which is why they are UPPER_SNAKE rather than following this API's other enums; they are matched byte for byte on the far side.
        Lighter's own numeric transaction type cannot stand in for this: closing a position is the same CreateOrder as opening one (reduce-only), and adding and removing margin share a single UpdateMargin. Only the caller knows which it meant.
      enum:
        - POSITION_CLOSE
        - POSITION_PARTIAL_CLOSE
        - POSITION_LIQUIDATION
        - POSITION_PARTIAL_LIQUIDATION
        - ORDER_CREATE
        - ORDER_CREATE_INTENT
        - ORDER_CANCEL
        - SET_LEVERAGE
        - MAIN_TO_SUB_TRANSFER
        - POSITION_MARGIN_ADD
        - POSITION_MARGIN_REMOVE
        - AUTO_CLOSE_TRIGGERED
        - AUTO_CLOSE_CANCELED
        - WITHDRAWAL
    ReportedTransaction:
      type: object
      description: One signed transaction that Lighter accepted.
      required:
        - type
        - tx_hash
      properties:
        type:
          $ref: '#/components/schemas/TransactionType'
        tx_hash:
          type: string
          minLength: 1
          maxLength: 128
          description: Lighter transaction hash, computed client-side from the signed transaction and therefore known before the venue replies. It becomes the event_id consumers deduplicate on, so the same submission must always be reported under the same hash.
          example: 0xdef0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcd
    ReportTransactionsRequest:
      type: object
      description: 'One user action, which may have taken more than one transaction: opening a position that also changes leverage is a SET_LEVERAGE followed by an ORDER_CREATE.'
      required:
        - submitted_at
        - transactions
        - proof
      properties:
        operation_id:
          type: string
          maxLength: 128
          description: 'Opaque client-side identifier grouping the transactions of one action. Never parsed here and not forwarded — the event stream has no field for it — so it serves our own log lines and support: the same action retried should reuse the same value.'
          example: 0f9c2b1e-4a7d-4f61-9c3a-1b2d3e4f5a6b
        submitted_at:
          type: string
          format: date-time
          description: When the client submitted the transactions to Lighter.
          example: "2026-07-29T10:00:00Z"
        transactions:
          type: array
          minItems: 1
          maxItems: 16
          description: 'In submission order. The order matters to consumers, which see one event per entry: a leverage change that preceded an order must precede it here too.'
          items:
            $ref: '#/components/schemas/ReportedTransaction'
        deadline:
          type: integer
          format: int64
          description: 'Unix seconds past which the signature below is refused, capped by the service at ten minutes ahead. Travels with signature: one without the other is a 400.'
          example: 1755600000
        signature:
          type: string
          pattern: ^0x[0-9a-fA-F]{130}$
          description: |-
            EIP-712 signature proving this wallet's L1 address, over LinkWallet(string walletId,uint64 deadline) under domain {name: TonkeeperPerps, version: "1", chainId: 1} with no verifyingContract. Encoded as 65 bytes of r‖s‖v hex; v may be 27/28 or 0/1, and the high-s form is refused.
            Read only while the wallet has proved no address yet; sign it in the same vault unlock as the trade being reported, so the user confirms once. Missing when it is needed answers 400 address_proof_required.
          example: 0x99ce24c2b78cd46c35a3608007ccece84254a4696045b7f5962a6e758ebeadcc250da971d87099ce2e03e429f0321c42ed4de6cd0c468507480a63b65e64ab801b
        proof:
          type: string
          pattern: ^[0-9a-fA-F]{130}$
          description: |-
            The wallet's consent to this report, signed with its own root key: hex of a 65-byte recoverable secp256k1 signature (R | S | V) over LP("perps.transactions.report.v1") | LP(wallet_id) | LP(l1_address) | LP(submitted_at) | LP(type) | LP(tx_hash) | ..., one length-prefixed pair per entry in the order they appear in transactions, and submitted_at as unix nanoseconds in decimal. The same length-prefixed framing custodial-battery uses for its send proof.
            Nanoseconds because that is the precision the events carry: submitted_at reaches consumers whole, as the event's timestamp and its event_time header, and a proof over whole seconds would leave the sub-second part free to change.
            Everything that reaches a consumer is inside it: the entries, their order, and the time the events carry. Nothing else in the body is signed -- operation_id never leaves this service.
            l1_address is named here and nowhere in the body, lowercase with its 0x, because a first report binds the wallet to an address exactly as a first deposit does. signature only proves that somebody holds the key to an address; this is the wallet saying which address is its own, without which a signature captured anywhere could attach a stranger's Lighter account to this wallet.
            Separate from signature, which proves an address; this proves an operation. It is what an access token cannot forge, since the key behind the wallet is not in it: a captured request cannot be turned into a report of different transactions.
            Required, and absent answers 401 operation_proof_required. Requires a format 2 wallet_id, which every multichain wallet has.
          example: 4355c47d63924e8a72e509b65029052eb6c299d53a04e167c5775fd466751c9d07299936d304c153f6443dfa05f40ff007d72911b6f72307f996231605b915621c
    SignedTransaction:
      type: object
      description: One transaction as the client signed it.
      required:
        - tx_type
        - tx_info
      properties:
        tx_type:
          type: integer
          format: int32
          description: 'Lighter''s transaction type, forwarded as given and not checked against a list here: which types it accepts, and which of them may share a batch, is Lighter''s to answer. Today its batch endpoint takes 14 CreateOrder, 15 CancelOrder, 16 CancelAllOrders, 17 ModifyOrder and 28 CreateGroupedOrders, while 20 UpdateLeverage and 29 UpdateMargin have to be the only entry in the request.'
          example: 14
        tx_info:
          type: string
          description: 'The signed payload, exactly as the signer produced it. Forwarded byte for byte: it is read only for the AccountIndex it names, and re-encoding it would break the signature over it.'
          example: '{"AccountIndex":738887,"ApiKeyIndex":3,"MarketIndex":1,"Nonce":5,"Sig":"..."}'
    SendTransactionsRequest:
      type: object
      required:
        - transactions
      properties:
        transactions:
          type: array
          minItems: 1
          description: In submission order. Lighter caps a batch at fifty and answers one as a whole, so a refusal refuses all of them; the cap is enforced there rather than restated here.
          items:
            $ref: '#/components/schemas/SignedTransaction'
    SentTransaction:
      type: object
      required:
        - tx_type
        - tx_hash
      properties:
        tx_type:
          type: integer
          format: int32
          description: Echoed from the request, so a result can be matched without counting positions.
          example: 14
        tx_hash:
          type: string
          description: Lighter's hash for the accepted transaction, and the event id it is reported under.
          example: f0c0cd6f3d9184eaca980b5036345426104bbcdf35b597f5c6019274dc266a82fd9d4fdea186c109
    SendTransactionsResponse:
      type: object
      required:
        - transactions
      properties:
        transactions:
          type: array
          description: One result per submitted transaction, in the order they were sent.
          items:
            $ref: '#/components/schemas/SentTransaction'
        predicted_execution_time_ms:
          type: integer
          format: int64
          description: Lighter's estimate of how long until the batch executes.
          example: 214
    NextNonce:
      type: object
      description: The next nonce for one account and one API key slot.
      required:
        - account_index
        - nonce
      properties:
        account_index:
          type: integer
          format: int64
          description: The Lighter account the caller's proved address owns.
          example: 738887
        nonce:
          type: integer
          format: int64
          description: The nonce the next transaction on this slot must carry. Zero for a slot that has signed nothing yet, which is an answer and not an absence.
          example: 5
    ErrorResponse:
      type: object
      description: Uniform error envelope for every non-2xx response. The HTTP status code carries the status; this body carries the machine-readable details.
      required:
        - code
        - retryable
      properties:
        code:
          type: string
          description: 'Stable machine-readable error code, from a flat catalog: validation_error, address_proof_required, token_expired, invalid_token, token_revoked, device_inactive, wallet_auth_required, wallet_auth_invalid, operation_proof_required, operation_proof_invalid, wallet_forbidden, not_found, conflict, upstream_unavailable, auth_unavailable, internal_error.'
          example: wallet_auth_invalid
        message:
          type: string
          nullable: true
          description: Human-readable explanation, may be null. Fixed per code, not composed per request, so it is for logs rather than for showing to a user.
          example: wallet authorization is invalid
        retryable:
          type: boolean
          description: Whether the client may safely retry the same request.
          example: false
        details:
          type: object
          nullable: true
          additionalProperties: true
          description: Optional structured context about the error.
      example:
        code: conflict
        message: conflict
        retryable: false
        details:
          reason: deposit_amount_mismatch
    OrderSide:
      type: string
      description: UI/domain order side. The proxy maps this to Lighter is_ask internally.
      enum:
        - long
        - short
    OrderType:
      type: string
      description: Order execution type.
      enum:
        - market
        - limit
    PositionSide:
      type: string
      description: Direction of an open position.
      enum:
        - long
        - short
    MarginMode:
      type: string
      description: Margin mode for a position.
      enum:
        - cross
        - isolated
    TimeInForce:
      type: string
      description: Time-in-force policy for an order.
      enum:
        - ioc
        - gtt
        - post_only
    OrderStatus:
      type: string
      description: Collapsed public order status (Lighter internal sub-statuses are never leaked).
      enum:
        - new
        - open
        - filled
        - partially_filled
        - canceled
        - rejected
    OrderCategory:
      type: string
      description: Functional category of an order.
      enum:
        - open
        - close
        - take_profit
        - stop_loss
        - liquidation
    ActivityType:
      type: string
      description: Type of an account activity/history item.
      enum:
        - fill
        - funding
        - deposit
        - withdrawal
        - liquidation
        - tp_executed
        - sl_executed
    AccountStatus:
      type: string
      description: Registration/activity status of the caller's Lighter account. not_registered is this service's own answer for a wallet with no account bound to it yet; active and inactive are Lighter's account status. None of the three is derived from has_l2_key.
      enum:
        - active
        - inactive
        - not_registered
    AssetDetailsType:
      type: string
      description: Asset details payload discriminator. More values can be added as asset details expands beyond perps.
      enum:
        - perps
    Account:
      type: object
      description: The caller's Lighter main account summary.
      properties:
        account_index:
          type: integer
        l1_address:
          type: string
          description: |-
            L1 (Ethereum) address keying this main account. Present whenever the wallet has proved one, status not_registered included: the address is never sent by the caller, so this is the only place to read back what the wallet is bound to. Absent only while it has proved nothing at all.
            Always lowercase, whatever case Lighter reports, because it is signed over verbatim: an operation proof is checked against the address in the form recorded here, and the same address in two casings is two different statements.
          example: 0x1f9840a85d5af5bf1d1762f925bdaddc4201f984
        status:
          $ref: '#/components/schemas/AccountStatus'
        has_l2_key:
          type: boolean
          description: 'Whether an L2 signing key is registered (ChangePubKey done). Independent of status: it comes from the account''s API keys, not from the account record. True exactly when api_keys below is non-empty.'
        api_keys:
          type: array
          description: The L2 signing keys registered on this account, one entry per occupied slot. Only occupied slots are listed, so an index absent here is one a client may register into, and an empty array means the account has no signing key at all. Absent while the wallet has no account.
          items:
            $ref: '#/components/schemas/AccountAPIKey'
        collateral:
          type: string
          description: Total collateral, human-unit decimal string.
          example: "1762.09"
        available_balance:
          type: string
          description: Balance available for new orders, human-unit decimal string.
          example: "980.15"
        created_at:
          type: string
          format: date-time
          nullable: true
          example: "2026-01-14T09:32:11Z"
    AccountAPIKey:
      type: object
      description: One L2 signing key registered on the account, as Lighter reports it.
      required:
        - api_key_index
        - public_key
      properties:
        api_key_index:
          type: integer
          description: The slot this key occupies. It is what a client names when it signs a transaction and when it reads a nonce from GET /transactions/next-nonce.
          example: 3
        public_key:
          type: string
          description: The key's public part. A client finds its own slot by comparing this against the key it holds, which is the only way to tell its key from another device's.
          example: 0x8e4ee0a2d3b1f2b9d1bb8a7ff2f3e4c6b5a49788c1d2e3f405162738495a6b7c
    Integrator:
      type: object
      description: Partner attribution for one caller. Every field is an integer in Lighter's own units and is signed verbatim; nothing here is a display value.
      required:
        - integrator_account_index
        - integrator_taker_fee
        - integrator_maker_fee
        - max_perps_taker_fee
        - max_perps_maker_fee
        - max_spot_taker_fee
        - max_spot_maker_fee
        - approval_ttl_ms
      properties:
        integrator_account_index:
          type: integer
          format: int64
          description: Lighter account the fees accrue to. Zero means attribution is off.
          example: 745796
        integrator_taker_fee:
          type: integer
          description: Taker fee in millionths of the fill's notional. 900 is 9 basis points.
          example: 900
        integrator_maker_fee:
          type: integer
          description: Maker fee in millionths of the fill's notional.
          example: 900
        max_perps_taker_fee:
          type: integer
          description: Perpetual taker ceiling to sign into ApproveIntegrator. Never below integrator_taker_fee, and raising it later needs a fresh approval from the same wallet.
          example: 1000
        max_perps_maker_fee:
          type: integer
          description: Perpetual maker ceiling to sign into ApproveIntegrator.
          example: 1000
        max_spot_taker_fee:
          type: integer
          description: Always zero -- this service does not trade spot.
          example: 0
        max_spot_maker_fee:
          type: integer
          description: Always zero.
          example: 0
        approval_ttl_ms:
          type: integer
          format: int64
          description: How far ahead of now the approval_expiry signed into ApproveIntegrator should sit, in milliseconds. Zero alongside a zero account index means there is nothing to approve.
          example: 31536000000
    Market:
      type: object
      description: A perpetual market and its live stats. All monetary/price/size fields are human-unit decimal strings; the *_decimals fields tell the client how to scale those values back into integer units when building/signing a tx.
      properties:
        market_index:
          type: integer
        symbol:
          type: string
        base_asset:
          type: string
        quote_asset:
          type: string
        status:
          type: string
          description: Market trading status (e.g. active, paused).
        price_decimals:
          type: integer
          description: Number of decimal places used to scale prices for signing.
        size_decimals:
          type: integer
          description: Number of decimal places used to scale base sizes for signing.
        tick_size:
          type: string
          description: Minimum price increment, human-unit decimal string.
          example: "0.01"
        step_size:
          type: string
          description: Minimum base size increment, human-unit decimal string.
          example: "0.0001"
        min_size_base:
          type: string
          description: Minimum order size in base units.
          example: "0.0010"
        max_size_base:
          type: string
          description: Maximum order size in base units.
          example: "5000.0000"
        min_size_quote:
          type: string
          description: Minimum order notional in quote units.
          example: "10.00"
        max_size_quote:
          type: string
          description: Maximum order notional in quote units.
          example: "20000000.00"
        max_leverage:
          type: integer
        maker_fee_pct:
          type: string
          description: Maker fee as a percentage string.
          example: "0.02"
        taker_fee_pct:
          type: string
          description: Taker fee as a percentage string.
          example: "0.05"
        initial_margin_fraction:
          type: integer
          description: Initial margin fraction in basis points (1/10000).
        maintenance_margin_fraction:
          type: integer
          description: Maintenance margin fraction in basis points (1/10000).
        closeout_margin_fraction:
          type: integer
          description: Closeout margin fraction in basis points (1/10000).
        funding_rate_hourly:
          type: string
          description: Current hourly funding rate, decimal string.
          example: "0.0000125"
        next_funding_at:
          type: string
          format: date-time
          nullable: true
          example: "2026-07-04T13:00:00Z"
        open_interest_usd:
          type: string
          description: Open interest in USD, human-unit decimal string.
          example: "48213900.00"
        volume_24h_usd:
          type: string
          example: "1023874500.00"
        last_price:
          type: string
          example: "3421.55"
        index_price:
          type: string
          example: "3421.10"
        mark_price:
          type: string
          example: "3421.72"
        price_change_24h:
          type: string
          description: 24h price change (percentage or absolute per client convention).
          example: "-1.84"
        high_24h:
          type: string
          example: "3502.10"
        low_24h:
          type: string
          example: "3380.00"
    AutoCloseLeg:
      type: object
      description: A single take-profit or stop-loss leg of an auto-close configuration.
      properties:
        trigger_price:
          type: string
          description: Price that triggers the leg, human-unit decimal string.
          example: "3600.00"
        price:
          type: string
          description: Limit price used once triggered, human-unit decimal string.
          example: "3595.00"
        order_type:
          type: string
          enum:
            - market
            - limit
        valid_to:
          type: integer
          format: int64
          nullable: true
          description: Expiry as a unix timestamp in seconds; null means good-till-cancel.
          example: 1780000000
    AutoCloseConfig:
      type: object
      description: Attached take-profit / stop-loss configuration for a position.
      properties:
        take_profit:
          allOf:
            - $ref: '#/components/schemas/AutoCloseLeg'
          nullable: true
          description: Take-profit leg, or null if none.
        stop_loss:
          allOf:
            - $ref: '#/components/schemas/AutoCloseLeg'
          nullable: true
          description: Stop-loss leg, or null if none.
    Venue:
      type: string
      description: The exchange a position lives on. One value today; the field exists so a position id stays unambiguous when a second venue appears.
      enum:
        - lighter
    PositionAutoCloseLeg:
      type: object
      description: 'One take-profit or stop-loss leg, with what it would do to the position if it fired. The projection is a property of the trigger price rather than of the leg''s size: it says what the position is worth at that price, whether the leg closes all of it or part.'
      properties:
        order_index:
          type: integer
          format: int64
          description: Lighter's own number for the order, assigned when it entered the book. A cancel or a modify is addressed by `market_index` plus this, so a client that edits the leg needs it.
          example: 281474976712114
        client_order_index:
          type: integer
          format: int64
          description: 'The number whoever created the order chose for it: Lighter stores and echoes it back, and never assigns one itself. Meaningful only to that creator -- nothing makes it unique between clients, and it cannot address the order. Match a leg to your own record of placing it, and treat it as opaque otherwise.'
          example: 1756280400123
        trigger_price:
          type: string
          description: Price that fires the leg.
          example: "68141.70"
        price:
          type: string
          description: The price Lighter carries alongside the trigger. A leg of type market carries one too -- a live take-profit triggering at 78030.7 came with 75765.6 -- so this is not empty just because the close is a market one.
          example: "75765.6"
        order_type:
          $ref: '#/components/schemas/OrderType'
        valid_to:
          type: integer
          format: int64
          nullable: true
          description: Expiry as a unix timestamp in seconds; null means good-till-cancel.
          example: 1780000000
        base_size:
          type: string
          description: How much of the traded asset the leg closes.
          example: "0.008164"
        share_pct:
          type: string
          description: The same size as a share of the position, in percentage points. Empty when the position size cannot be divided by.
          example: "100"
        projected_equity:
          type: string
          description: What the position would be worth at the trigger price, in quote units. Empty when the entry price or the size is missing.
          example: "32.24"
        projected_roi_pct:
          type: string
          description: The same outcome against the margin invested, in percentage points.
          example: "61.36"
    PositionAutoClose:
      type: object
      description: The take-profit and stop-loss legs attached to a position. A leg is null when the position has none of that kind.
      properties:
        take_profit:
          allOf:
            - $ref: '#/components/schemas/PositionAutoCloseLeg'
          nullable: true
        stop_loss:
          allOf:
            - $ref: '#/components/schemas/PositionAutoCloseLeg'
          nullable: true
    OpenPositionDetail:
      type: object
      description: One open position and the auto-close legs attached to it.
      properties:
        position:
          $ref: '#/components/schemas/OpenPosition'
        auto_close_known:
          type: boolean
          description: 'Whether the legs were read. False means they were not: the wallet has stored no read-only token, the stored one expired, or it could not be decrypted. A client must not read a null auto_close as "none" while this is false -- offering to set a take-profit over an existing one would replace it.'
        auto_close:
          allOf:
            - $ref: '#/components/schemas/PositionAutoClose'
          nullable: true
          description: The legs, or null when there are none -- or when auto_close_known is false.
    OpenPositionsPage:
      type: object
      description: The caller's open positions. An object rather than a bare array so aggregates or a cursor can be added later without breaking clients.
      properties:
        positions:
          type: array
          items:
            $ref: '#/components/schemas/OpenPosition'
    OpenPosition:
      type: object
      description: 'One open position, carrying the numbers a position card renders. Money is in quote units (USDC) and sizes are in the traded asset, both as human-unit decimal strings. Percentages are decimal strings in percentage points: "-3.02" means -3.02 %.'
      properties:
        id:
          type: string
          description: 'Identifies the position for the detail endpoint. Opaque -- read it from here and hand it back, do not parse it. A position has no id of its own on Lighter: it is keyed by account and market, and the account is the one the wallet proved, so this is composed here. It names the slot rather than the episode: closing and reopening the same market returns the same id.'
          example: lighter:1
        venue:
          $ref: '#/components/schemas/Venue'
        market_index:
          type: integer
          description: The venue's own market number. Redundant with part of `id`, and kept because the trading screen is addressed by it.
        symbol:
          type: string
          example: BTC
        side:
          $ref: '#/components/schemas/PositionSide'
        size:
          type: string
          description: Unsigned position size in the traded asset.
          example: "0.008164"
        position_value:
          type: string
          description: Notional value of the position in quote units.
          example: "540.00"
        avg_entry_price:
          type: string
          example: "66541.70"
        mark_price:
          type: string
          description: From the markets snapshot, not from the position -- a position carries no price of its own. Empty when that snapshot is unavailable.
          example: "66141.70"
        liquidation_price:
          type: string
          description: Zero on a position with no leverage, which is a value rather than a gap.
          example: "64141.75"
        liquidation_distance_pct:
          type: string
          description: How far the liquidation price sits from the mark price, in percentage points. Empty when either price is zero.
          example: "-3.02"
        margin:
          type: string
          description: Margin backing the position, in quote units. Lighter allocates margin per position only in isolated mode; in cross mode it reports zero there, and this is derived from the notional and the initial margin fraction instead.
          example: "19.98"
        equity:
          type: string
          description: Margin plus the unrealized result -- what the position is worth to the holder right now. Derived here so every client shows the same number.
          example: "16.71"
        unrealized_pnl:
          type: string
          example: "-3.27"
        realized_pnl:
          type: string
          description: Accumulated from partial closes on this position.
          example: "0.00"
        roi_pct:
          type: string
          description: 'The result so far against the margin invested, in percentage points. Funding is not in the numerator: Lighter has already folded it into the margin balance. Empty when there is no margin to divide by.'
          example: "-16.37"
        leverage:
          type: integer
          description: Derived from the initial margin fraction. Zero means it could not be derived, never that the position is unleveraged -- no leverage is 1.
          example: 27
        margin_mode:
          $ref: '#/components/schemas/MarginMode'
        funding_paid:
          type: string
          description: Funding accumulated over the life of the position. Negative means paid out.
          example: "-0.000566"
        open_order_count:
          type: integer
          description: Orders resting on this market, take-profit and stop-loss legs among them. Zero means the detail endpoint has no orders to add.
          example: 2
    Position:
      type: object
      description: An open position in a single market.
      properties:
        market_index:
          type: integer
        symbol:
          type: string
        side:
          $ref: '#/components/schemas/PositionSide'
        size:
          type: string
          description: Unsigned position size in base units, human-unit decimal string.
          example: "2.5000"
        avg_entry_price:
          type: string
          example: "3380.20"
        mark_price:
          type: string
          example: "3421.72"
        position_value:
          type: string
          description: Current notional value of the position in quote units.
          example: "8554.30"
        unrealized_pnl:
          type: string
          example: "103.80"
        realized_pnl:
          type: string
          example: "42.11"
        liquidation_price:
          type: string
          example: "2980.00"
        margin_mode:
          $ref: '#/components/schemas/MarginMode'
        allocated_margin:
          type: string
          description: Margin allocated to this position in quote units.
          example: "1710.86"
        leverage:
          type: integer
        funding_paid:
          type: string
          description: Cumulative funding paid (negative if received).
          example: "-1.24"
        auto_close:
          allOf:
            - $ref: '#/components/schemas/AutoCloseConfig'
          nullable: true
          description: Attached TP/SL configuration, or null if none.
        open_order_count:
          type: integer
    PositionState:
      type: object
      description: 'The state of one market for the caller: the position it holds, the one that ended last, and what the venue said about the orders a client order index names.'
      required:
        - market_index
        - open
        - last_closed
        - orders
      properties:
        market_index:
          type: integer
          description: 'The market the id named. No symbol here on purpose: naming it means reading the venue''s market list, and this endpoint is meant to be polled without touching the venue at all.'
          example: 1
        open:
          allOf:
            - $ref: '#/components/schemas/PositionEpisode'
          nullable: true
          description: 'The position this market holds now, or null when it holds none. There is no separate status field: null is the whole answer, and two ways to say it would let them disagree. Always present, null included, so a decoder that distinguishes an absent key from a null one does not have to.'
        last_closed:
          allOf:
            - $ref: '#/components/schemas/PositionEpisode'
          nullable: true
          description: The episode that ended most recently, or null if none ever did. What tells a client that watched a position that it closed, rather than that it never existed.
        orders:
          type: array
          description: Newest first, and capped. Empty without the client_order_index parameter, and empty while no event has arrived for it yet.
          items:
            $ref: '#/components/schemas/PositionStateOrder'
    PositionEpisode:
      type: object
      description: One life of a position on one market, from the fill that opened it to the one that closed it.
      required:
        - episode_id
        - side
        - opened_at
        - open_seen
        - closed_at
        - close_reason
      properties:
        episode_id:
          type: string
          description: Lighter's trade id of the fill that opened the episode, which is also its identity. Opaque; a string because it is an identifier and not a number to do arithmetic on.
          example: "29800309063"
        side:
          $ref: '#/components/schemas/PositionSide'
        opened_at:
          type: string
          format: date-time
          description: When the opening fill traded, in the venue's own time.
          example: "2026-09-08T18:50:14Z"
        open_seen:
          type: boolean
          description: 'false when this service adopted the episode mid-flight: the first fill it saw already found a position, so opened_at is that fill''s time and not when the position opened. A client should not present it as an opening time when this is false.'
        closed_at:
          type: string
          format: date-time
          nullable: true
          description: Null while the episode is open.
        close_reason:
          type: string
          nullable: true
          description: 'What ended it. `fill` is an ordinary close and `liquidation` a fill the venue marked as one. `event` is every close with no fill of ours behind it -- an auto-deleverage, or one whose fill this service never saw: the venue reported the position gone without saying why, and this does not claim to know either. Treat the set as open-ended; a later release may name a reason `event` covers today.'
          enum:
            - fill
            - liquidation
            - event
    PositionStateOrder:
      type: object
      description: What the venue said about one order, as this service recorded it.
      required:
        - order_index
        - status
      properties:
        order_index:
          type: integer
          format: int64
          description: Lighter's own number for the order. A cancel or a modify is addressed by `market_index` plus this.
          example: 844421542005799
        kind:
          type: string
          description: The venue's own word for what kind of order it was, e.g. `market`, `take-profit`, `stop-loss`, `liquidation`.
          example: market
        status:
          type: string
          description: The venue's own word, passed through unmapped -- Lighter does not document the set of values it uses, and mapping them by guess would report a state nobody established. An order still working carries something other than `filled` or `canceled`.
          example: filled
        filled_base:
          type: string
          description: What the venue says was filled, in base units. Zero for an order still resting in the book.
          example: "0.00014"
        reduce_only:
          type: boolean
          description: True for a closing order, which is how a close is told from an open before any fill lands.
        recorded_at:
          type: string
          format: date-time
          description: 'This service''s own clock: when the order was first written here, not when the venue created it. An order can rest in the book for twenty minutes before an event brings it.'
          example: "2026-09-08T19:45:02Z"
    OrderFees:
      type: object
      description: Fee breakdown for an order, all human-unit decimal strings.
      properties:
        taker:
          type: string
          example: "0.42"
        integrator:
          type: string
          example: "0.10"
        total:
          type: string
          example: "0.52"
    Order:
      type: object
      description: A single order and its execution state.
      properties:
        id:
          type: string
          description: Identifies the order for the detail endpoint. Opaque -- read it from here and hand it back, do not parse it. It names the venue and the venue's own order number.
          example: lighter:281474976712112
        order_index:
          type: integer
          format: int64
          description: Lighter's own number for the order, assigned when it entered the book. A cancel or a modify is addressed by `market_index` plus this.
          example: 84512377281
        client_order_index:
          type: integer
          format: int64
          description: 'The number whoever created the order chose for it: Lighter stores and echoes it back, and never assigns one itself. Zero means nobody chose one -- it is a real value in the payload rather than an absent field. Match an order to your own record of placing it, and treat it as opaque otherwise.'
          example: 1756280400123
        market_index:
          type: integer
        symbol:
          type: string
        side:
          $ref: '#/components/schemas/OrderSide'
        type:
          $ref: '#/components/schemas/OrderType'
        status:
          $ref: '#/components/schemas/OrderStatus'
        category:
          $ref: '#/components/schemas/OrderCategory'
        base_size:
          type: string
          description: Order size in base units, human-unit decimal string.
          example: "2.5000"
        price:
          type: string
          description: Order limit price (empty/ignored for market orders).
          example: "3380.20"
        filled_base:
          type: string
          description: Filled amount in base units.
          example: "1.0000"
        filled_quote:
          type: string
          description: Filled amount in quote units.
          example: "3380.20"
        avg_fill_price:
          type: string
          nullable: true
          example: "3380.20"
        trigger_price:
          type: string
          nullable: true
          description: Trigger price for conditional orders, null otherwise.
          example: "3600.00"
        reduce_only:
          type: boolean
        time_in_force:
          $ref: '#/components/schemas/TimeInForce'
        created_at:
          type: string
          format: date-time
          example: "2026-07-04T12:20:00Z"
        updated_at:
          type: string
          format: date-time
          example: "2026-07-04T12:41:03Z"
        expires_at:
          type: string
          format: date-time
          nullable: true
          example: "2026-07-05T12:20:00Z"
        pnl:
          type: string
          nullable: true
          description: Realized PnL attributed to this order (close orders), null otherwise.
          example: "42.11"
        roi:
          type: string
          nullable: true
          description: Return on investment as a decimal string, null if not applicable.
          example: "0.0124"
        fees:
          allOf:
            - $ref: '#/components/schemas/OrderFees'
          nullable: true
          description: 'Fee breakdown, null if not yet known. Always null today: nothing populates it, so a client must not rely on it. Lighter reports per-order fees and this service does not map them yet.'
        sort_ts:
          type: string
          format: date-time
          description: Sort timestamp used for keyset pagination and poll ranking.
          example: "2026-07-04T12:41:03Z"
    Balance:
      type: object
      description: Account-level balance summary, all human-unit decimal strings.
      properties:
        currency:
          type: string
        equity:
          type: string
          example: "1865.89"
        available_balance:
          type: string
          example: "980.15"
        transferable_balance:
          type: string
          example: "820.00"
        unrealized_pnl_total:
          type: string
          example: "103.80"
        collateral:
          type: string
          example: "1762.09"
    TradingFlags:
      type: object
      description: Per-account capability flags gating trading actions in the UI.
      properties:
        open_enabled:
          type: boolean
        close_enabled:
          type: boolean
        cancel_enabled:
          type: boolean
        add_margin_enabled:
          type: boolean
        remove_margin_enabled:
          type: boolean
        auto_close_enabled:
          type: boolean
    ActivityItem:
      type: object
      description: A single item in the account activity feed. Most fields are nullable because their relevance depends on the item type.
      properties:
        id:
          type: string
          description: Stable within the feed, not a resource id. For a deposit it is the lowercased Ethereum transaction hash, which is what keeps one deposit one item from pending through credited; other types carry Lighter's own id for the record behind them.
          example: act_9f1a2b3c
        type:
          $ref: '#/components/schemas/ActivityType'
        timestamp:
          type: string
          format: date-time
          description: When the event happened. A deposit is timestamped by when it was registered while this service is the only record of it, and by when the money landed once Lighter has it -- so a deposit item can move in the feed while keeping its id.
          example: "2026-07-04T12:41:03Z"
        market_index:
          type: integer
          nullable: true
        symbol:
          type: string
          nullable: true
        side:
          allOf:
            - $ref: '#/components/schemas/OrderSide'
          nullable: true
          description: Side for trade-like items, null otherwise.
        size:
          type: string
          nullable: true
          description: Base size for trade-like items.
          example: "1.0000"
        price:
          type: string
          nullable: true
          example: "3380.20"
        amount:
          type: string
          nullable: true
          description: Quote amount for funding/deposit/withdrawal items.
          example: "500.00"
        realized_pnl:
          type: string
          nullable: true
          example: "42.11"
        fee:
          type: string
          nullable: true
          example: "0.52"
        tx_hash:
          type: string
          nullable: true
          example: 0x9a3f1c2b7e5d4a6f8c0b1d2e3f4a5b6c7d8e9f0a1b2c3d4e5f60718293a4b5c6d
        status:
          type: string
          nullable: true
          description: Free-form status label appropriate to the item type. For a deposit it is this service's own pending or credited while it is the only record of it, and Lighter's own word for the deposit once Lighter has it. The two vocabularies are deliberately not merged -- Lighter does not document the set of values it uses, and mapping them by guess would report a state nobody established.
        sort_ts:
          type: string
          format: date-time
          description: Sort timestamp used for keyset pagination and poll ranking.
          example: "2026-07-04T12:41:03Z"
    MarketsScreen:
      type: object
      description: Payload for the markets list screen.
      properties:
        markets:
          type: array
          items:
            $ref: '#/components/schemas/Market'
    TradingScreen:
      type: object
      description: 'Perps asset details payload for a single market. Only open_orders needs a read-only token, and this service reads it from its own store rather than from the caller: the position, its PnL and the balance all come from the account snapshot, which Lighter serves by account index and which needs no token. Without a usable token open_orders is empty, and two fields derived from it go with it -- flags.cancel_enabled is false and position.auto_close is null, since the TP/SL legs are themselves open orders.'
      properties:
        type:
          $ref: '#/components/schemas/AssetDetailsType'
        market:
          $ref: '#/components/schemas/Market'
        position:
          allOf:
            - $ref: '#/components/schemas/Position'
          nullable: true
          description: Caller's position in this market, or null if none.
        open_orders:
          type: array
          description: Caller's open orders in this market (empty without a usable stored token).
          items:
            $ref: '#/components/schemas/Order'
        balance:
          $ref: '#/components/schemas/Balance'
        flags:
          $ref: '#/components/schemas/TradingFlags'
    PortfolioScreen:
      type: object
      description: Payload for the portfolio screen.
      properties:
        balance:
          $ref: '#/components/schemas/Balance'
        positions:
          type: array
          items:
            $ref: '#/components/schemas/Position'
    Portfolio:
      type: object
      description: 'Balance, open positions and resting orders in one payload. The two sections are independent: a position is what the account holds, an order is what it is waiting for.'
      properties:
        balance:
          $ref: '#/components/schemas/Balance'
        positions:
          type: array
          items:
            $ref: '#/components/schemas/OpenPosition'
        open_orders:
          type: array
          description: Orders resting on the book, across every market. Empty when open_orders_known is false, which is a different thing from having none. Take-profit and stop-loss legs are not among them.
          items:
            $ref: '#/components/schemas/Order'
        open_orders_known:
          type: boolean
          description: Whether open_orders was read at all. False without a usable stored read-only token, and when the venue did not answer. Never a reason to fail the response.
          example: true
    OpenOrdersPage:
      type: object
      description: The caller's resting orders. An object rather than a bare array so the flag rides alongside and aggregates can be added later.
      properties:
        orders:
          type: array
          items:
            $ref: '#/components/schemas/Order'
        orders_known:
          type: boolean
          description: Whether the list was read at all. False means `orders` is empty because nothing could be read, not because nothing is resting -- the same flag Portfolio carries.
          example: true
    OrderDetail:
      type: object
      description: One order and the trades it produced.
      properties:
        order:
          $ref: '#/components/schemas/Order'
        resting:
          type: boolean
          description: True when the order is still on the book, false when it was found in history.
          example: false
        fills:
          type: array
          description: The trades this order took part in, newest first. Empty when it never traded, and also when fills_known is false.
          items:
            $ref: '#/components/schemas/OrderFill'
        fills_known:
          type: boolean
          description: Whether the fills were read in full. False when the lookup failed and when its page cap ended it early; `fills` is then empty rather than partial. The order is the answer without them, so neither fails the request.
          example: true
    OrderFill:
      type: object
      description: One trade an order took part in. Money is in quote units, sizes in the traded asset.
      properties:
        trade_id:
          type: integer
          format: int64
          description: The venue's own number for the trade.
          example: 1043773
        size:
          type: string
          example: "0.00014"
        price:
          type: string
          example: "77771.30"
        quote_amount:
          type: string
          description: What the trade was worth in quote units.
          example: "10.89"
        is_maker:
          type: boolean
          description: True when this order sat in the book and the other side took it.
          example: false
        tx_hash:
          type: string
          description: The hash of the transaction that produced the trade, which is the taker's order submission. Occasionally a placeholder on the venue's side.
          example: 0x8f2c...
        traded_at:
          type: string
          format: date-time
          example: "2026-09-18T12:41:03Z"
    ActivityPage:
      type: object
      description: A page of the account activity feed.
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/ActivityItem'
        next_cursor:
          type: string
          nullable: true
          description: Cursor for the next page; null on the last page.
          example: eyJvZmZzZXQiOjQwfQ==
        last_sort_ts:
          type: string
          format: date-time
          nullable: true
          description: Max sort timestamp across the filtered set, for poll ranking-shift detection.
          example: "2026-07-04T12:41:03Z"
    OpenDepositRequest:
      type: object
      required:
        - operation_id
        - asset_id
        - amount
        - l1_tx_hash
        - proof
      properties:
        operation_id:
          type: string
          maxLength: 128
          description: |-
            Opaque client-side identifier for this deposit attempt, never parsed here. Retrying the same attempt must reuse it — that is what makes this call idempotent — and a genuinely new deposit must carry a new one. Reusing it with a different amount is a conflict, not an update.
            A write key only. Progress is read by deposit_id, and this value is not a lookup key: recording the same transaction under a second operation_id returns the record created under the first one, keeping the first one's value.
          example: 0f9c2b1e-4a7d-4f61-9c3a-1b2d3e4f5a6b
        asset_id:
          type: string
          maxLength: 128
          description: 'Where the funds started, in the swap backend''s own asset id form. Opaque here: kept as a record and never resolved, because what arrives at Lighter is USDC on Ethereum whichever chain the money came from.'
          example: arb/mainnet/erc20/0xaf88d065e77c8cc2239327c5edb3a432268e5831
        amount:
          type: string
          description: 'What was sent, as a decimal string, at most 6 decimal places and not below the gateway''s 1 USDC floor — less than that is accepted by the contract and then never credited. Kept as declared: Lighter records only what arrives, so this is the only copy of what was meant, and "expected N, got M" can be answered from nowhere else.'
          example: "25"
        execution_id:
          type: string
          maxLength: 128
          description: 'The swap this deposit is funded by, as the swap backend named it. Optional, kept for correlation and support: it is what a failed swap is told apart by, and what a server-side resolver will one day turn into the Ethereum hash so that l1_tx_hash stops being required. Nothing reads it yet.'
          example: 26176e1a-d5aa-4b00-b4b3-4af2e1d904cc
        l1_tx_hash:
          type: string
          pattern: ^0x[0-9a-fA-F]{64}$
          description: |-
            The Ethereum transaction that called Lighter's gateway. Required: it is the only handle this service can confirm a deposit with — Lighter resolves it to the credit, the amount and the account index, and does so without a read-only token, which a first deposit could not have anyway since the account does not exist yet.
            Only the Ethereum hash counts. A caller that paid from another chain holds a source-chain hash, which Lighter has never seen; it has to wait for the aggregator to deliver and record the deposit then. That restriction is temporary and will be lifted once execution_id can be resolved to the delivered hash server-side.
          example: 0xecf31cab1cb7f5cd0010b5858d3248035288baa23804be478e7d5750c49b2380
        deadline:
          type: integer
          format: int64
          description: 'Unix seconds past which the signature below is refused, capped by the service at ten minutes ahead. Travels with signature: one without the other is a 400, because a missing deadline would otherwise be reported as a signature that has expired.'
          example: 1755600000
        signature:
          type: string
          pattern: ^0x[0-9a-fA-F]{130}$
          description: |-
            EIP-712 signature proving the caller holds the key to the L1 address this deposit is recorded against, over LinkWallet(string walletId,uint64 deadline) under domain {name: TonkeeperPerps, version: "1", chainId: 1} with no verifyingContract. Encoded as 65 bytes of r‖s‖v hex; v may be 27/28 or 0/1, and the high-s form is refused.
            Send it every time, signed in the same vault unlock as the deposit transaction: it is read only while the wallet has proved no address yet, and the client cannot tell when that is. Missing when it is needed answers 400 address_proof_required.
          example: 0x99ce24c2b78cd46c35a3608007ccece84254a4696045b7f5962a6e758ebeadcc250da971d87099ce2e03e429f0321c42ed4de6cd0c468507480a63b65e64ab801b
        proof:
          type: string
          pattern: ^[0-9a-fA-F]{130}$
          description: |-
            The wallet's consent to this deposit, signed with its own root key: hex of a 65-byte recoverable secp256k1 signature (R | S | V) over LP("perps.deposit.register.v1") | LP(wallet_id) | LP(l1_address) | LP(operation_id) | LP(amount) | LP(asset_id) | LP(l1_tx_hash) | LP(execution_id), in the same length-prefixed framing custodial-battery uses for its send proof. Every term as this service records it: as sent here with surrounding whitespace trimmed and l1_tx_hash lowercased, execution_id an empty string when omitted, l1_address lowercase with its 0x.
            Note that l1_address is named here and nowhere in the body. signature only proves that somebody holds the key to an address; this is the wallet saying which address is its own. Both are needed on a first deposit: without this one an EIP-712 signature captured anywhere could bind this wallet to a stranger's Lighter account.
            Required on every deposit, and absent answers 401 operation_proof_required. Requires a format 2 wallet_id, which every multichain wallet has.
          example: 4355c47d63924e8a72e509b65029052eb6c299d53a04e167c5775fd466751c9d07299936d304c153f6443dfa05f40ff007d72911b6f72307f996231605b915621c
    Deposit:
      type: object
      description: One recorded deposit.
      properties:
        deposit_id:
          type: string
          description: Identifies this deposit when polling its progress. A random UUID, so it cannot be guessed from an address or a sequence, but it is not what authorises the poll -- that is the wallet the deposit belongs to, see the GET operation. Worth persisting alongside whatever the client calls the attempt, and not fatal to lose, since posting the same transaction again returns the same id rather than a second deposit.
          example: 0f9c2b1e-4a7d-4f61-9c3a-1b2d3e4f5a6b
        status:
          type: string
          enum:
            - pending
            - credited
            - unfunded
          description: |-
            pending until Lighter credits the funds (credited) or nothing has arrived within the waiting window (unfunded).
            unfunded means the deposit was not confirmed while it was being watched, which is not quite the same as the money never arriving: what arrives is Lighter's to say and this record only tracks it. A deposit credited after the window is not noticed, so an unfunded record is where such a deposit stays. Treat it as "we did not see it", not as proof of loss, and check the account balance before telling anyone their money is gone.
          example: pending
        asset_id:
          type: string
          description: The network and token the funds were sent as; echoed from the request.
          example: arb/mainnet/erc20/0xaf88d065e77c8cc2239327c5edb3a432268e5831
        amount:
          type: string
          description: What the caller declared, echoed back. Compare with credited_amount.
          example: "25"
        credited_amount:
          type: string
          description: What Lighter actually credited, once it has. Absent while the deposit is pending, and also on the rare credit confirmed without an amount — where the only signal was an account appearing, which proves an arrival but not its size.
          example: "24.970000"
        l1_tx_hash:
          type: string
          description: The Ethereum transaction this deposit was recorded against, echoed back.
          example: 0xecf31cab1cb7f5cd0010b5858d3248035288baa23804be478e7d5750c49b2380
        account_index:
          type: integer
          format: int64
          description: The Lighter account the deposit belongs to. Absent until the account exists, which for a first deposit is until it is credited — that deposit is what creates it.
          example: 736568
        created_at:
          type: string
          format: date-time
          description: When the deposit was recorded here.
        closed_at:
          type: string
          format: date-time
          description: When it stopped being pending. Absent while it still is.
    OrderBookLevel:
      type: object
      required:
        - price
        - size
      properties:
        price:
          type: string
          example: "65000.10"
        size:
          type: string
          description: Size in base units at that price.
          example: "0.5"
    TruncatedOrderBook:
      type: object
      required:
        - updated_at
        - truncated
      properties:
        updated_at:
          type: string
          format: date-time
          description: When the book this was cut from was last updated upstream.
        truncated:
          type: boolean
          description: Whether the notional was reached. False means the levels returned are the whole book and they still did not cover it.
        bids:
          type: array
          description: Present for side=sell. Absent otherwise.
          items:
            $ref: '#/components/schemas/OrderBookLevel'
        asks:
          type: array
          description: Present for side=buy. Absent otherwise.
          items:
            $ref: '#/components/schemas/OrderBookLevel'
    DepositQuoteRequest:
      type: object
      required:
        - source_asset
        - source_amount
        - sender_address
        - destination_address
      properties:
        source_asset:
          type: string
          maxLength: 128
          description: 'What the caller pays with, as `<chain>/mainnet/coin` for a chain''s own coin or `<chain>/mainnet/erc20/<address>` for a token. Chains quoted today: ton, eth, bsc, base, arb. Anything else answers 400 unsupported_source_asset.'
          example: ton/mainnet/coin
        source_amount:
          type: string
          pattern: ^[1-9][0-9]{0,77}$
          description: How much of source_asset the caller is willing to spend, in the asset's smallest unit (nanoton, wei, the token's own decimals). The payloads never ask for more than this.
          example: "25000000000"
        sender_address:
          type: string
          maxLength: 128
          description: The address on the source chain the payloads are sent from, in that chain's own form. It is also where a failed fill is refunded to.
          example: UQARERERERERERERERERERERERERERERERERERERERERERbvW
        destination_address:
          type: string
          pattern: ^0x[0-9a-fA-F]{40}$
          description: The Ethereum address whose Lighter account is credited. Must be the L1 address this wallet has proved, once it has proved one; a first deposit is quoted for the address it names.
          example: 0x1f9840a85d5aF5bf1D1762F925BDADdC4201F984
    DepositQuote:
      type: object
      required:
        - quote_id
        - provider
        - created_at
        - expires_at
        - input
        - output
        - payloads
      properties:
        quote_id:
          type: string
          description: Names this quote in logs and support. Not a lookup key.
          example: q_3f9c2b1e4a7d4f619c3a1b2d3e4f5a6b
        provider:
          type: string
          enum:
            - relay
            - direct
          description: Who fills the order. relay is the cross-chain aggregator; direct means the source asset is already USDC on Ethereum and the payloads call the gateway themselves.
          example: relay
        created_at:
          type: string
          format: date-time
        expires_at:
          type: string
          format: date-time
          description: Past this, ask again rather than sign.
        input:
          $ref: '#/components/schemas/DepositQuoteInput'
        output:
          $ref: '#/components/schemas/DepositQuoteOutput'
        slippage_bps:
          type: integer
          description: 'The slippage the quote allowed for, in basis points. It applies to the source side: the deposit itself is exact.'
          example: 100
        payloads:
          type: array
          description: What to sign and broadcast, in this order.
          items:
            $ref: '#/components/schemas/QuotePayload'
        tracking:
          $ref: '#/components/schemas/QuoteTracking'
    DepositQuoteInput:
      type: object
      description: The request, echoed.
      required:
        - source_asset
        - source_amount
        - sender_address
      properties:
        source_asset:
          type: string
          example: ton/mainnet/coin
        source_amount:
          type: string
          example: "25000000000"
        sender_address:
          type: string
          example: UQARERERERERERERERERERERERERERERERERERERERERERbvW
    DepositQuoteOutput:
      type: object
      required:
        - asset_id
        - destination_address
        - expected_amount
        - min_amount
      properties:
        asset_id:
          type: string
          description: What arrives, always USDC on Ethereum.
          example: eth/mainnet/erc20/0xa0b86991c6218b36c1d19d4a2e9eb0ce3606eb48
        destination_address:
          type: string
          example: 0x1f9840a85d5af5bf1d1762f925bdaddc4201f984
        expected_amount:
          type: string
          description: What is deposited, in USDC's smallest unit (6 decimals).
          example: "34746294"
        min_amount:
          type: string
          description: 'Equal to expected_amount: the deposit is exact.'
          example: "34746294"
    QuotePayload:
      type: object
      description: 'One thing to sign. Which fields of meta are set depends on the chain: a TON message carries to, value, data (the body as a base64 BOC), bounce and mode; an EVM transaction carries to, value and data (0x calldata).'
      required:
        - payload_id
        - type
        - chain_id
        - meta
      properties:
        payload_id:
          type: string
          example: p_01
        type:
          type: string
          enum:
            - main
            - approval
          description: approval is a token allowance the main transaction needs; main moves the funds. An approval always precedes its main.
          example: main
        chain_id:
          type: string
          description: The chain to broadcast on, as `<chain>/mainnet`.
          example: ton/mainnet
        fee:
          $ref: '#/components/schemas/PayloadFee'
        meta:
          $ref: '#/components/schemas/PayloadMeta'
    PayloadMeta:
      type: object
      required:
        - to
        - value
      properties:
        to:
          type: string
          example: EQCrdGsDTqA2t6xRR4N6V4J705F7w_VQbUdHnofsh-8lVIPs
        value:
          type: string
          description: In the chain's smallest unit.
          example: "25000000000"
        data:
          type: string
          description: A base64 BOC on TON, 0x calldata on an EVM chain. Absent when there is none.
          example: te6cckEBAQEASAAAjAAAAAAweGYwNWExZmJj
        bounce:
          type: boolean
          description: TON only.
          example: false
        mode:
          type: integer
          description: TON only, the send mode.
          example: 1
    PayloadFee:
      type: object
      description: 'The network fee the wallet should expect, when the quote knows it, in the chain''s smallest unit. Which fields of data are set depends on type: value is a flat amount and nothing else; evm is a legacy gas transaction, limit and price with amount their product; eip1559 is limit, max_price and miner_price with amount as limit times max_price, and network_price only when the quote stated a base fee. Absent when the quote knows no fee -- a direct quote, or a chain whose fee the wallet estimates itself.'
      required:
        - type
        - data
      properties:
        type:
          type: string
          enum:
            - value
            - evm
            - eip1559
          example: eip1559
        data:
          type: object
          required:
            - amount
          properties:
            amount:
              type: string
              example: "1000000000000"
            limit:
              type: string
              description: evm and eip1559.
              example: "100000"
            price:
              type: string
              description: evm only.
              example: "10000000"
            network_price:
              type: string
              description: eip1559 only, and only when known.
              example: "10000000"
            max_price:
              type: string
              description: eip1559 only.
              example: "20000000"
            miner_price:
              type: string
              description: eip1559 only.
              example: "0"
    QuoteTracking:
      type: object
      description: 'How to follow the fill. Absent when provider is direct: the client broadcast the gateway call itself and holds its hash.'
      required:
        - execution_id
        - status_url
      properties:
        execution_id:
          type: string
          description: swaps-backend's execution id for the fill.
          example: a3f1c2d4-5b6e-4f70-8a9b-0c1d2e3f4a5b
        status_url:
          type: string
          description: The path to poll, under this API's base path.
          example: /tk-perps/public-api/v1/funding/status/a3f1c2d4-5b6e-4f70-8a9b-0c1d2e3f4a5b
    FundingStatus:
      type: object
      required:
        - execution_id
        - status
      properties:
        execution_id:
          type: string
        status:
          type: string
          enum:
            - pending
            - success
            - failure
            - refund
            - unknown
          description: pending until the aggregator settles it. success, failure and refund are final. unknown is an execution nobody has heard of, which is also what a quote nobody paid becomes once swaps-backend closes it out.
          example: pending
        details:
          type: string
          description: The aggregator's own words about a failure or refund, when it has any.
        tx_hashes:
          type: array
          description: The Ethereum transactions of the fill, once there are any. The first is the one that called the gateway, and what POST /funding/deposit takes as l1_tx_hash.
          items:
            type: string
        in_tx_hashes:
          type: array
          description: The source-chain transactions the aggregator saw.
          items:
            type: string
  responses:
    Unauthorized:
      description: |-
        Missing or invalid authentication. Code token_expired means the token's own life ended and a refresh answers it; wallet_auth_invalid and operation_proof_invalid mean the session is fine and a signature is not; invalid_token means none of these and the caller has to authenticate again.
        token_revoked (the sessions behind the token were reset, so a refresh answers it only while the device is still logged in) and device_inactive (the device is revoked or was never registered, so it has to register again) can only come from an endpoint that asks multichain-backend. None does today, so both are declared without being produced — see the KeeperAuth scheme.
      content: &id001
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    BadRequest:
      description: Invalid request.
      content: *id001
    NotFound:
      description: Resource not found.
      content: *id001
    Forbidden:
      description: |-
        Authenticated, but not entitled to the wallet named in X-Wallet-Id: multichain-backend does not have it bound to the calling device. Apart from 401 because refreshing the token cannot help, and deliberately indistinguishable from a wallet that does not exist — telling those apart would report whether it does.
        Never produced today: no endpoint asks that registry, so nothing reaches this. A wallet nobody can sign for fails as 401 wallet_auth_invalid instead. Declared on every endpoint all the same, so that one starting to ask is not a change of contract — handle it.
        A device that is itself revoked or unregistered answers 401 device_inactive instead: that is about the caller and not about any wallet, so it can be named, and the client has to register again rather than show a wallet as unavailable.
      content: *id001
    Conflict:
      description: |-
        The request contradicts what is already recorded: a deposit under this operation_id, or the Lighter account a wallet is bound to. Not retryable -- repeating it reproduces the same disagreement.
        Code readonly_token_unavailable is the same shape of answer about a different record: the wallet has no usable read-only token, and an endpoint that can read nothing without one says so here rather than as a 503. The service is up; what is missing is the wallet's own credential, minted through /account/ro-token/issue.
      content: *id001
    ServiceUnavailable:
      description: A dependency this request needs is unavailable; the request may be retried. Code auth_unavailable means the token was never judged, because the issuer's key set could not be loaded — keep the token and back off rather than refreshing it. Code upstream_unavailable means Lighter did not answer.
      content: *id001
    InternalError:
      description: This service failed, and the caller cannot fix it by changing the request. Declared on every operation because any of them can reach it.
      content: *id001
