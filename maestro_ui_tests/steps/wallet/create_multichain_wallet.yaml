appId: com.jbig.tonkeeper
---
# Create New Wallet on the multichain build creates a multichain (bip39) wallet with a
# 12-word phrase. After the passcode the onboarding pushes the backup intro (header Skip)
# and then the push-permission step; both are skipped so the flow lands on Customize.
# The intro title carries a non-breaking space before "phrase".
- tapOn: Create New Wallet
- assertVisible: Create passcode
- repeat:
    times: 4
    commands:
      - tapOn: ${PASSWORD_KEY}

- assertVisible: Re-enter passcode
- repeat:
    times: 4
    commands:
      - tapOn: ${PASSWORD_KEY}

- extendedWaitUntil:
    visible: "Back up your recovery\u00a0phrase"
    timeout: 10000
    optional: true
- runFlow:
    when:
      visible: "Back up your recovery\u00a0phrase"
    commands:
      - tapOn: Skip
      - waitForAnimationToEnd:
          timeout: 3000

- runFlow: ../skip_notifications_onboarding.yaml

- extendedWaitUntil:
    visible: Customize your Wallet
    timeout: 10000
- assertVisible: Wallet
- tapOn: "Continue"
# Continue spins while the multichain accounts are created and synced over the network;
# the next screen is only there once Customize is gone. Above the 15s house limit for
# that reason.
- extendedWaitUntil:
    notVisible: Customize your Wallet
    timeout: 60000
