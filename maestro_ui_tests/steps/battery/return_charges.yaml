# Refunds the remaining Battery balance: Charges history → Details → Return charges.
# Prerequisite: Battery refill screen is open.
# Ends back on the refill screen, scrolled to the history section, browser closed.
appId: com.jbig.tonkeeper
---
- runFlow: reveal_refill_bottom.yaml
- tapOn:
    id: battery_charges_history
    waitToSettleTimeoutMs: 5000
    retryTapIfNoChange: true

# Opens bat.tonkeeper.com in the in-app browser — the native title shows at once, the web
# content with the purchase card arrives later. Above the 15s house limit: it is a page
# load over the network on a cold CI simulator.
- extendedWaitUntil:
    visible: Charges history
    timeout: 30000
- extendedWaitUntil:
    visible: Details
    timeout: 30000
- tapOn: Details
- scrollUntilVisible:
    element: Return charges
    direction: DOWN
    timeout: 30000
- tapOn: Return charges
- tapOn:
    id: close
