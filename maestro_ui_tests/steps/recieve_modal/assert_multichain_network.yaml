appId: com.jbig.tonkeeper
---
# Env: NETWORK_NAME, INDEX, ADDRESS_TITLE, DISCLAIMER
- assertVisible: ${NETWORK_NAME}
- copyTextFrom:
    text: ".*\\.\\.\\..*"
    below: ${NETWORK_NAME}
- evalScript: ${output.shortAddress = maestro.copiedText; output.addrPrefixRegex = output.shortAddress.split('...')[0] + '.*'}
- assertTrue:
    condition: ${output.shortAddress != null && output.shortAddress.indexOf('...') >= 0}
    label: ${NETWORK_NAME} short address visible

- tapOn:
    text: Icons/Size28/copy-outline
    index: ${INDEX}
- assertVisible: Copied
- waitForAnimationToEnd:
    timeout: 2500

- tapOn:
    text: Icons/Size28/qr-code-alternate
    index: ${INDEX}
- waitForAnimationToEnd:
    timeout: 3000
- assertVisible: ${ADDRESS_TITLE}
- assertVisible: ${DISCLAIMER}
- copyTextFrom:
    text: ${output.addrPrefixRegex}
- evalScript: ${output.fullAddr = (maestro.copiedText || '').replace(/\n/g, ''); var parts = output.shortAddress.split('...'); output.addrOk = parts.length === 2 && output.fullAddr.startsWith(parts[0]) && output.fullAddr.endsWith(parts[1]);}
- assertTrue:
    condition: ${output.addrOk}
    label: ${NETWORK_NAME} full address matches short

- tapOn:
    id: receive_close
- waitForAnimationToEnd:
    timeout: 2000
- assertVisible: Receiving address
