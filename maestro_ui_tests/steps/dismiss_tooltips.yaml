# Dismisses entry-point tooltips. A hint is presented above the screen behind a full-screen
# dismiss control (`id: tooltip_dismiss`), so the first tap anywhere only closes the bubble —
# a test that taps its own target right away silently loses that tap.
# Tap the dismiss control, never the bubble (`id: tooltip`): a tap on the bubble performs the
# hint's target action (the add-multichain-wallet hint opens the wallets list, which then
# covers the tab bar). The next queued tooltip may appear right after, hence the loop; times
# cap it so a stuck queue cannot hang.
appId: com.jbig.tonkeeper
---
- repeat:
    times: 10
    while:
      visible:
        id: tooltip
    commands:
      - tapOn:
          id: tooltip_dismiss
      - waitForAnimationToEnd:
          timeout: 1500
