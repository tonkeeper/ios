# Dismisses entry-point tooltips (`id: tooltip`). A hint is presented above the screen
# behind a full-screen dismiss control, so the first tap anywhere only closes the bubble —
# a test that taps its own target right away silently loses that tap.
# Tapping the bubble dismisses it without firing its target action, and the next queued
# tooltip may appear right after, hence the loop. Times cap it so a stuck queue cannot hang.
appId: com.jbig.tonkeeper
---
- repeat:
    times: 10
    while:
      visible:
        id: tooltip
    commands:
      - tapOn:
          id: tooltip
      - waitForAnimationToEnd:
          timeout: 1500
