appId: com.jbig.tonkeeper
---
- extendedWaitUntil:
    visible: Enter recovery phrase
    timeout: 30000

# Paste reads simulator UIPasteboard (primed once on CI before maestro test; not re-copied on retry).
- tapOn: Paste

# iOS 17+ system sheet: "Allow Paste" (skip if already allowed or no prompt).
- waitForAnimationToEnd:
    timeout: 3000
- tapOn:
    text: Allow Paste
    optional: true

