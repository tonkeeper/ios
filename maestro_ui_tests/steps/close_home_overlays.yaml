appId: com.jbig.tonkeeper
---
# Stories popup and home banners block scrolling and are UI the tests don't need.
# Stories close on their own after the last page; a tap aimed at the close button while
# they vanish lands on the home Settings gear underneath. Wait them out (0.7 s when there
# are none); the import steps keep a fallback tap for a story that never ends.
- extendedWaitUntil:
    notVisible:
      id: stories_close
    timeout: 45000
    optional: true
- waitForAnimationToEnd:
    timeout: 3000
# Cap times so a stuck banner close loop cannot hang the suite.
- repeat:
    times: 10
    while:
      visible:
        id: home_banner_close
    commands:
      - tapOn:
          id: home_banner_close
          index: 0
      - waitForAnimationToEnd:
          timeout: 1000
- runFlow: dismiss_tooltips.yaml
