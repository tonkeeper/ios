# One cluster, one simulator build. A shard = one section
# folder = one funded wallet: the pasteboard is primed once per shard and the imported
# wallet is reused across its flows, so sections never mix seeds.
clusters:
  multichain:
    gate_pipeline: true
    build_artifact: maestro-ios-tonkeeper-app-multichain
    # Same JSON shape as MAESTRO_FEATURE_FLAG_OVERRIDES (disable_swap, disable_battery, …).
    # Merged into FlagsOverride.json on the simulator build — not via GHA job output.
    feature_flags_file: ci/multichain-flags.json
    # Shards imported with the TON seed (MAESTRO_WALLET_WITH_MONEY*) instead of the
    # multichain seed (MAESTRO_MC_WALLET_MONEY*). The ton_ prefix keeps the wallet
    # visible in the shard id; every other section runs on the multichain seed.
    ton_wallet_shards:
      - ton_battery
      - ton_browser
      - ton_collectibles
      - ton_staking
      - ton_tonconnect
      - ton_trade
      - ton_transactions
    flows:
      - flows/multichain/backup/*
      - flows/multichain/portfolio/*
      - flows/multichain/wallet/*
      - flows/multichain/import/*
      - flows/multichain/battery/*
      - flows/multichain/swap_common/*
      # swap_pairs parked: the pair matrix is not run in CI for now.
      # Re-add this line (and skip_auto_rerun: [swap_pairs]) to bring it back.
      - flows/multichain/send/*
      - flows/multichain/trade/*
      - flows/multichain/staking/*
      - flows/multichain/ton_battery/*
      - flows/multichain/ton_browser/*
      - flows/multichain/ton_collectibles/*
      - flows/multichain/ton_staking/*
      - flows/multichain/ton_tonconnect/*
      - flows/multichain/ton_trade/*
      - flows/multichain/ton_transactions/*

testOutputDir: ../build/maestro-output
