# regress_EN: Browser Screen — Explore / Connected tabs; Connected empty state.
appId: com.jbig.tonkeeper
---
- runFlow: "../../../steps/launch_app_ensure_wallet.yaml"
- runFlow: "../../../steps/browser/open_browser_tab.yaml"

- extendedWaitUntil:
    visible: Connected
    timeout: 60000

- tapOn:
    text: Connected
    optional: true
- extendedWaitUntil:
    visible: "Connected apps will\u00a0be\u00a0shown\u00a0here"
    timeout: 30000
- assertVisible: "Explore apps and services in\u00a0Tonkeeper\u00a0browser."


- runFlow:
    when:
      visible: Explore
    commands:
      - tapOn: Explore
      - extendedWaitUntil:
          visible: "All"
          timeout: 120000
