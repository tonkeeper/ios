appId: com.jbig.tonkeeper
---
- launchApp:
    clearState: true

- runFlow: "../../../steps/create_new_wallet.yaml"

- runFlow: "../../../steps/backup/open_backup_warning_continue.yaml"

- runFlow: "../../../steps/password/enter_password.yaml"

- extendedWaitUntil:
    visible:
      id: "mnemonic.word.0"
    timeout: 15000

- evalScript: ${output.captured = []}
- evalScript: ${output.i = 0}

- repeat:
    while:
      true: ${output.i <= 23}
    commands:
      - copyTextFrom:
          id: "mnemonic.word.${output.i}"
      - evalScript: ${output.captured[output.i] = maestro.copiedText}
      - assertTrue:
          condition: ${output.captured[output.i] != null && output.captured[output.i].length > 0}
          label: "Captured word ${output.i} must be non-empty"
      - evalScript: ${output.i = output.i + 1}

- runFlow: "../../../steps/backup/complete_backup_check.yaml"
