# Canary: one TON-seed import-to-home pass on the multichain build. The ton_* shards
# all start from this import, so it gates the matrix together with the multichain
# import canary next to it.
# Not part of any shard: config.yaml globs do not cover flows/canary/**.
appId: com.jbig.tonkeeper
---
- launchApp:
    clearState: true

- runFlow: "../../../steps/launch_app_ensure_ton_wallet.yaml"

- extendedWaitUntil:
    visible: Trade
    timeout: 60000
