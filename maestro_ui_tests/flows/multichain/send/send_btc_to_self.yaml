# Multichain Send: BTC on Bitcoin to self (address from Receive).
appId: com.jbig.tonkeeper
---
- runFlow: "../../../steps/launch_app_ensure_multichain_wallet.yaml"
- runFlow:
    file: "../../../steps/recieve_modal/copy_network_address.yaml"
    env:
      NETWORK_NAME: "Bitcoin"
      ADDRESS_TITLE: "Your Bitcoin address"
- runFlow:
    file: "../../../steps/send/send_to_clipboard_recipient.yaml"
    env:
      SEARCH_QUERY: "BTC"
      ASSET_ID: "token_picker_asset_btc_btc"
      TOKEN_SYMBOL: "BTC"
      AMOUNT: "0.00004"
      RECIPIENT: ${output.fullAddr}
