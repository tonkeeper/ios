# Multichain Send: ETH on Ethereum to self (address from Receive).
appId: com.jbig.tonkeeper
---
- runFlow: "../../../steps/launch_app_ensure_multichain_wallet.yaml"
- runFlow:
    file: "../../../steps/recieve_modal/copy_network_address.yaml"
    env:
      NETWORK_NAME: "Ethereum"
      ADDRESS_TITLE: "Your Ethereum address"
- runFlow:
    file: "../../../steps/send/send_to_clipboard_recipient.yaml"
    env:
      SEARCH_QUERY: "ETH"
      ASSET_ID: "token_picker_asset_eth_eth"
      TOKEN_SYMBOL: "ETH"
      AMOUNT: "0.0001"
      RECIPIENT: ${output.fullAddr}
