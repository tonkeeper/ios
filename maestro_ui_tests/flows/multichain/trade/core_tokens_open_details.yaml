# Core tokens shelf → open BTC/ETH/BNB/TRX/GRAM/USDT and check balance, price, activity.
#
# KNOWN BUG — "Transaction history" can be missing for an asset the wallet holds.
# TradeAssetDetailsMultichainHistoryViewModel loads the last 25 wallet activities of the
# asset's chain and only then filters them by assetId, so an asset whose events fell out of
# that window renders no history section at all (multichainHistorySection() returns nil on an
# empty preview). BNB never renders it at all — BSC events never reach the section, and the
# wallet History tab likewise offers no BSC filter. The other tokens lose it whenever busier
# assets on the same chain push them out of the window: USD₮ (TON) drops out as soon as the
# suite runs a few TON swaps, so a green run yesterday says nothing about today.
# The assertions stay enabled on purpose so the suite keeps reporting the bug.
appId: com.jbig.tonkeeper
---
- runFlow: "../../../steps/trade/open_multichain_trade.yaml"

- runFlow:
    file: "../../../steps/trade/open_core_token_details.yaml"
    env:
      SYMBOL: "BTC"
      EXPECT_TRANSACTION_HISTORY: "true"

- runFlow:
    file: "../../../steps/trade/open_core_token_details.yaml"
    env:
      SYMBOL: "ETH"
      EXPECT_TRANSACTION_HISTORY: "true"

# BNB is the permanent case of the KNOWN BUG above, so its history section is not expected.
- runFlow:
    file: "../../../steps/trade/open_core_token_details.yaml"
    env:
      SYMBOL: "BNB"
      EXPECT_TRANSACTION_HISTORY: "false"

- runFlow:
    file: "../../../steps/trade/open_core_token_details.yaml"
    env:
      SYMBOL: "TRX"
      EXPECT_TRANSACTION_HISTORY: "true"

- runFlow:
    file: "../../../steps/trade/open_core_token_details.yaml"
    env:
      SYMBOL: "GRAM"
      EXPECT_TRANSACTION_HISTORY: "true"

# Core tokens shelf shows Tether as USD₮ (U+20AE).
- runFlow:
    file: "../../../steps/trade/open_core_token_details.yaml"
    env:
      SYMBOL: "USD₮"
      EXPECT_TRANSACTION_HISTORY: "true"
