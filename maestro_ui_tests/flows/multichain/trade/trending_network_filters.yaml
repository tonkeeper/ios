# Trending shelf network filter (All control to the right of Trending).
# Opens 3 filtered tokens and asserts their details header matches the network.
appId: com.jbig.tonkeeper
---
- runFlow: "../../../steps/trade/open_multichain_trade.yaml"

- extendedWaitUntil:
    visible: Trending
    timeout: 60000
- assertVisible: All

# --- Ethereum ---
- tapOn:
    text: All
    rightOf: Trending
- waitForAnimationToEnd:
    timeout: 2000
- tapOn: Ethereum
- waitForAnimationToEnd:
    timeout: 3000
- assertVisible: Ethereum
- runFlow:
    file: "../../../steps/trade/assert_trending_network_headers.yaml"
    env:
      NETWORK_HEADER: "Ethereum"

# --- Ton ---
- tapOn:
    text: Ethereum
    rightOf: Trending
- waitForAnimationToEnd:
    timeout: 2000
- tapOn: Ton
- waitForAnimationToEnd:
    timeout: 3000
- assertVisible: Ton
- runFlow:
    file: "../../../steps/trade/assert_trending_network_headers.yaml"
    env:
      NETWORK_HEADER: "TON"

# --- Back to All ---
- tapOn:
    text: Ton
    rightOf: Trending
- waitForAnimationToEnd:
    timeout: 2000
- tapOn:
    text: All
    index: 0
- waitForAnimationToEnd:
    timeout: 3000
- assertVisible: All
