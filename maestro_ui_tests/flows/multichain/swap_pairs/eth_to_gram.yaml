# Multichain Swap success: ETH → GRAM at $3 fiat send amount.
appId: com.jbig.tonkeeper
---
- runFlow: "../../../steps/launch_app_ensure_multichain_wallet.yaml"
- runFlow: "../../../steps/swap/open_swap.yaml"
- runFlow:
    file: "../../../steps/swap/select_pair.yaml"
    env:
      SEND_QUERY: "ETH"
      SEND_ASSET_ID: "token_picker_asset_eth_eth"
      RECEIVE_QUERY: "GRAM"
      RECEIVE_ASSET_ID: "token_picker_asset_ton_gram"
- runFlow:
    file: "../../../steps/swap/enter_fiat_amount.yaml"
    env:
      FIAT_AMOUNT: "3"
- runFlow: "../../../steps/swap/confirm_and_sign.yaml"
